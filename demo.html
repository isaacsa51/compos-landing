            { id:'blue', label:'Azul de marca', sw:['#E6ECF5','#FFFFFF','#1F5BD8'] }

          // Scale fixed-size app frames into whatever box they sit in.
          window.fitFrames = function (root) {
            (root || document).querySelectorAll('[data-fit]').forEach(function (box) {
              if (box._fit) return; box._fit = true;
              var f = box.querySelector('iframe'), wh = box.getAttribute('data-fit').split('x');
              var w = +wh[0], h = +wh[1];
              f.style.width = w + 'px'; f.style.height = h + 'px';
              var go = function () {
                var s = Math.min(box.clientWidth / w, (box.clientHeight || 1e9) / h);
                f.style.transform = 'scale(' + s + ')';
                f.style.left = ((box.clientWidth - w * s) / 2) + 'px';
                f.style.top = box.hasAttribute('data-fit-top') ? '0px' : ((box.clientHeight - h * s) / 2) + 'px';
              };
              new ResizeObserver(go).observe(box); go();
            });
          };
          window.POS_COLORS = [
            { id:'verde', label:'Verde', hex:'#1E9E5A' }, { id:'rosa', label:'Rosa', hex:'#E0457B' }, { id:'amarillo', label:'Amarillo', hex:'#F2B90C' },

          ];
          window.posTheme = function () { var t = 'default'; try { t = localStorage.getItem('compos-theme') || 'default'; } catch (e) {} return t === 'qsr' ? 'default' : t; };
          window.posSetTheme = function (id) { try { localStorage.setItem('compos-theme', id); } catch (e) {} };
        })();
    </script>

        .main{display:grid;grid-template-columns:268px minmax(0,1fr) 300px;min-height:0}

        .dev.phone{background:#000;padding:8px;border-radius:54px;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 0 0 3px #2B2E30}
        .dev .scr{position:relative;overflow:hidden;border-radius:14px;width:100%;height:100%}
        .dev.phone .scr{border-radius:46px}
        .dev iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#111315}

        .info{border-left:1px solid rgba(255,255,255,.1);padding:24px 20px;display:flex;flex-direction:column;gap:16px;overflow:auto}
        .info .k{font-size:12px;letter-spacing:.04em;color:#969696}
        .info h1{font-family:var(--font-display);font-size:30px;line-height:1.1;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:balance}
        .info p{margin:0;font-size:15px;line-height:1.55;color:#D0D0D0;text-wrap:pretty}
        .try{background:#1D1F20;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
        .try ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:t}

        .pins{font-size:13px;color:#ABABAB;line-height:1.5}
        .pins b{color:#fff;font-weight:600}
        .nav{margin-top:auto;display:flex;gap:8px}

        .nav button.go{background:#fff;color:#111315;border-color:#fff}
        .nav button:hover{background:#292C2D}.nav button.go:hover{background:#E8E8E8}
        .nav button:disabled{opacity:.4;cursor:default}
        .bar{height:4px;border-radius:2px;background:#292C2D;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint-200);transition:width .28s cubic-bezier(.2,.8,.2,1)}
        @media (max-width:1180px){.main{grid-template-columns:220px minmax(0,1fr)}.info{display:none}.mobile-info{display:flex!important}}

        .mobile-info button{height:44px;padding:0 18px;border-radius:999px;border:0;background:#fff;color:#111315;font-weight:500;cursor:pointer}
    </style>
</head>

<script>
    (function () {
      var F = window.POS_FLOW, P = window.POS_PHONE, $ = function (id) { return document.getElementById(id); };
      var app = $('app'), dev = $('dev'), box = $('box'), seen = {}, cur = 0, device = 'tablet', W = 1194, H = 834;
      var idx = function (id) { for (var i = 0; i < F.length; i++) if (F[i].id === id) return i; return -1; };
      var base = function (p) { return decodeURIComponent(p.split('/').pop()); };
      $('steps').innerHTML = window.POS_PHASES.map(function (ph) {
        return '<div class="ph">' + ph + '</div>' + F.map(function (s, i) { return s.phase === ph ? '<button class="st" data-i="' + i + '"><span class="n">' + (i + 1) + '</span>' + s.title + '</button>' : ''; }).join('');
      }).join('');
      $('theme').innerHTML = window.POS_THEMES.map(function (t) { return '<option value="' + t.id + '">' + t.label + '</option>'; }).join('') +
        '<optgroup label="Tu color">' + window.POS_COLORS.map(function (c) { return '<option value="custom:' + c.hex + '">Tu color: ' + c.label.toLowerCase() + '</option>'; }).join('') + '</optgroup>';
      $('theme').value = window.posTheme();
      var fit = function () {
        var pad = device === 'phone' ? 16 : 24, bw = box.clientWidth, bh = box.clientHeight;
        var s = Math.min((bw - pad) / W, (bh - pad) / H, device === 'phone' ? 1 : 1.2);
        var dw = W * s + pad, dh = H * s + pad;
        dev.style.width = dw + 'px'; dev.style.height = dh + 'px';
        dev.style.left = (bw - dw) / 2 + 'px'; dev.style.top = (bh - dh) / 2 + 'px';
        app.style.width = W + 'px'; app.style.height = H + 'px'; app.style.transform = 'scale(' + s + ')';
      };
      new ResizeObserver(fit).observe(box);
      var paint = function () {
        document.querySelectorAll('[data-dev]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-dev') === device); });
        dev.classList.toggle('phone', device === 'phone');
        document.querySelectorAll('.st').forEach(function (b) {
          var i = +b.getAttribute('data-i');
          b.classList.toggle('seen', !!seen[i]);
          if (i === cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
        });
        var s = F[cur];
        $('kicker').textContent = 'Paso ' + (cur + 1) + ' de ' + F.length + ' · ' + s.phase + (device === 'phone' ? ' · Teléfono' : '');
        $('title').textContent = s.title; $('body').textContent = s.body;
        $('try').innerHTML = s.tryIt.map(function (t) { return '<li>' + t + '</li>'; }).join('');
        $('prog').style.width = ((cur + 1) / F.length * 100) + '%';
        $('mtitle').textContent = (cur + 1) + '. ' + s.title;
        $('prev').disabled = $('mprev').disabled = cur === 0;
        $('next').textContent = cur === F.length - 1 ? 'Terminar' : 'Siguiente paso';
      };
      var fileOf = function (i) { return device === 'phone' && P.files[F[i].id] ? P.dir + P.files[F[i].id] : F[i].file; };
      var hash = function () { history.replaceState(null, '', '#' + F[cur].id + (device === 'phone' ? '-telefono' : '')); };
      var load = function () {
        var src = fileOf(cur);
        W = device === 'phone' ? P.w : 1194; H = device === 'phone' ? P.h : 834;
        $('full').href = src;
        if (base(app.getAttribute('src') || '') !== base(src) || (app.getAttribute('src') || '').indexOf('pos-mobile') !== src.indexOf('pos-mobile')) app.setAttribute('src', src);
        fit(); paint(); hash();
      };
      var go = function (i) { cur = Math.max(0, Math.min(F.length - 1, i)); seen[cur] = true; load(); };
      window.addEventListener('message', function (e) {
        if (!e.data || !e.data.posScreen) return;
        {
          var b = e.data.posScreen;
          for (var i = 0; i < F.length; i++) if (base(fileOf(i)) === b && i !== cur) { cur = i; seen[i] = true; paint(); $('full').href = fileOf(i); hash(); break; }
        }
      });
      $('steps').addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b) go(+b.getAttribute('data-i')); });
      $('prev').onclick = $('mprev').onclick = function () { go(cur - 1); };
      $('next').onclick = $('mnext').onclick = function () {
        if (cur === F.length - 1) location.href = 'index.html'; else go(cur + 1);
      };
      document.querySelectorAll('[data-dev]').forEach(function (b) { b.onclick = function () { device = b.getAttribute('data-dev'); load(); }; });
      $('theme').onchange = function () { var t = this.value; window.posSetTheme(t); app.contentWindow.postMessage({ posTheme:t }, '*'); };
      document.addEventListener('keydown', function (e) {
        if (e.target.tagName === 'SELECT') return;
        if (e.key === 'ArrowRight') go(cur + 1);
        if (e.key === 'ArrowLeft') go(cur - 1);
      });
      var h = location.hash.slice(1);
      if (/-telefono$|^phone$/.test(h)) { device = 'phone'; h = h.replace(/-telefono$|^phone$/, ''); }
      go(Math.max(0, idx(h)));
    })();
</script>
