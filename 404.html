<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página no encontrada — Compos</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root{color-scheme:dark}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(60% 46% at 50% 0%,rgba(116,114,246,.36),transparent 70%),#111315;color:#F3F4F5;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
        main{max-width:460px;display:flex;flex-direction:column;align-items:center;gap:18px}
        img{width:64px;height:64px}
        .code{font-size:14px;letter-spacing:.08em;color:#B9B8FC}
        h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1.1;letter-spacing:-.02em}
        p{margin:0;color:#ABABAB;font-size:16px;line-height:1.55}
        nav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
        a{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.3)}
        a.go{background:#7472F6;border-color:#7472F6}
        a:hover{filter:brightness(1.1)}
    </style>
</head>
<body>
<main>
    <img src="/brand/compos-symbol.svg" alt="" width="64" height="64">
    <span class="code">ERROR 404</span>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Lo demás sigue «semper listo».</p>
    <nav><a class="go" href="/">Ir al inicio</a><a href="/demo">Probar la demo</a></nav>
</main>
</body>
</html>
