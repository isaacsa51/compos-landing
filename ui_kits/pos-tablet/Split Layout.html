<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Compos — Split</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="../theme.js"></script>
    <style>
        html,body{margin:0;height:100%}body{background:var(--surface-canvas);font-family:var(--font-ui);color:var(--text-primary)}#root{height:100vh;min-height:700px}button{font-family:inherit}button:disabled{opacity:.45}a{color:var(--text-link)}a:hover{color:var(--white)}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:6px}
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
            integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
            integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
            integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
            crossorigin="anonymous"></script>
    <script src="../../_ds_bundle.js"></script>
    <script src="../i18n.js"></script>
    <script src="data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-src="PosExtras.jsx">
    const { Icon: PXIcon, Button: PXButton, IconButton: PXIconButton, Badge: PXBadge, QuantityStepper: PXStepper } = window.ComposDesignSystem_9739cd;

    /* ---------- Modifiers ---------- */
    const PX_SIZE = { id:'size', name:'Tamaño', min:1, max:1, options:[['Chico',0],['Mediano',20],['Grande',40]] };
    const PX_TEMP = { id:'temp', name:'Base', min:1, max:1, options:[['Arroz',0],['Fideos',0]] };
    const PX_ICE = { id:'ice', name:'Tipo de fideo', min:1, max:1, options:[['Udon',0],['Ramen',0],['Soba',0]] };
    const PX_MILK = { id:'milk', name:'Proteína', min:1, max:1, options:[['Pollo',0],['Res',15],['Salmón',35],['Camarón',35],['Tofu',0]] };
    const PX_EXTRAS = { id:'extras', name:'Extras', min:0, max:3, options:[['Extra proteína',45],['Sin cebollín',0],['Aguacate',25],['Huevo marinado',20],['Alga nori',15],['Ajonjolí',10]] };
    const PX_SWEET = { id:'sweet', name:'Picante', min:0, max:1, options:[['Sin picante',0],['Suave',0],['Medio',0],['Muy picante',0]] };
    const pxOptMilk = { ...PX_MILK, min:0, name:'Proteína extra' };
    const PX_ICE_DEP = { ...PX_ICE, dependsOn:{ group:'temp', value:'Fideos' } };
    const PX_MODS = {
      'Bowl teriyaki': [PX_SIZE, PX_TEMP, PX_ICE_DEP, PX_MILK, PX_EXTRAS, PX_SWEET],
      'Bowl spicy tuna': [PX_SIZE, PX_MILK, PX_EXTRAS, PX_SWEET],
      'Bowl katsu': [PX_SIZE, PX_TEMP, PX_ICE_DEP, PX_MILK, PX_EXTRAS],
      'Ramen miso': [PX_SIZE, PX_TEMP, PX_ICE_DEP, pxOptMilk, PX_EXTRAS, PX_SWEET],
      'Ramen tonkotsu': [PX_SIZE, PX_TEMP, PX_ICE_DEP, PX_MILK, PX_EXTRAS],
      'Yakisoba': [PX_SIZE, PX_ICE, pxOptMilk, PX_EXTRAS, PX_SWEET],
    };
    const pxMoney = (n) => '$' + n.toFixed(2);
    const pxRule = (g) => g.min > 0 ? (g.max === 1 ? 'Required · Pick 1' : 'Required · ' + g.min + '–' + g.max) : (g.max === 1 ? 'Optional · Pick 1' : 'Optional · Up to ' + g.max);

    function ModifierPanel({ item, basePrice, onCancel, onAdd, compact }) {
      const all = PX_MODS[item] || [];
      const [sel, setSel] = React.useState(() => ({ size:['Chico'] }));
      const [qty, setQty] = React.useState(1);
      const [note, setNote] = React.useState('');
      const [noteOpen, setNoteOpen] = React.useState(false);
      const groups = all.filter((g) => !g.dependsOn || (sel[g.dependsOn.group] || []).includes(g.dependsOn.value));
      const toggle = (g, opt) => setSel((s) => {
        const cur = s[g.id] || [];
        let next;
        if (cur.includes(opt)) next = g.min === 1 && g.max === 1 ? cur : cur.filter((x) => x !== opt);
        else next = g.max === 1 ? [opt] : (cur.length >= g.max ? cur : [...cur, opt]);
        return { ...s, [g.id]:next };
      });
      const missing = groups.filter((g) => (sel[g.id] || []).length < g.min);
      const chosen = groups.flatMap((g) => (sel[g.id] || []).map((o) => [o, g.options.find((x) => x[0] === o)[1]]));
      const unit = basePrice + chosen.reduce((s, [, d]) => s + d, 0);
      const add = () => onAdd({ name:item, unit, qty, mods:chosen.map(([o]) => o), note:note.trim() });
      const groupCard = (g) => {
        const cur = sel[g.id] || [];
        const ok = cur.length >= g.min;
        return (
          <section key={g.id} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding: compact ? 12 : 14, display:'flex', flexDirection:'column', gap:10, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>{g.name}</span>
              {g.dependsOn && <PXBadge tone="neutral">If {g.dependsOn.value}</PXBadge>}
              <span style={{ marginLeft:'auto', fontSize:'var(--text-xs)', color: g.min > 0 && !ok ? 'var(--status-checkedin)' : 'var(--text-muted)', display:'flex', alignItems:'center', gap:4 }}>
                {g.min > 0 && ok && <PXIcon name="check" size={12} />}{pxRule(g)}
              </span>
            </div>
            <div style={{ display: compact ? 'flex' : 'grid', flexWrap:'wrap', gridTemplateColumns:'minmax(0,1fr)', gap:8 }}>
              {g.options.map(([o, d]) => {
                const on = cur.includes(o);
                const full = !on && g.max > 1 && cur.length >= g.max;
                return (
                  <button key={o} onClick={() => toggle(g, o)} disabled={full} style={{ minHeight: compact ? 44 : 52, padding:'0 14px', borderRadius:'var(--radius-sm)', border: on ? 'none' : '1px solid var(--border-strong)', background: on ? 'var(--mint-200)' : 'transparent', color: on ? 'var(--text-on-light)' : 'var(--text-primary)', display:'flex', alignItems:'center', gap:10, fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)', cursor: full ? 'not-allowed' : 'pointer', textAlign:'left', flex: compact ? '0 0 auto' : undefined }}>
                    {!compact && <span style={{ width:18, height:18, flex:'0 0 auto', borderRadius: g.max === 1 ? 9 : 5, border: on ? 'none' : '1.5px solid var(--border-strong)', background: on ? 'var(--black-900)' : 'transparent', color:'var(--mint-200)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>{on && <PXIcon name="check" size={12} />}</span>}
                    <span style={{ flex:1 }}>{o}</span>
                    {d > 0 && <span style={{ fontSize:'var(--text-xs)', opacity:.75 }}>+{d.toFixed(2)}</span>}
                  </button>
                );
              })}
            </div>
          </section>
        );
      };
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column' }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, padding: compact ? '12px 12px 8px' : '16px 20px' }}>
            <PXIconButton icon="arrow-left" label="Back to menu" variant="secondary" onClick={onCancel} />
            <span style={{ display:'flex', flexDirection:'column', minWidth:0 }}>
              <span style={{ fontSize: compact ? 'var(--text-h3)' : 'var(--text-h1)', fontWeight:'var(--weight-semibold)' }}>{item}</span>
              <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>From {pxMoney(basePrice)} · {all.filter((g) => g.min > 0).length} required choices</span>
            </span>
            <button onClick={() => setNoteOpen((v) => !v)} style={{ marginLeft:'auto', height:40, padding:'0 14px', borderRadius:'var(--radius-pill)', border:'1px solid var(--border-strong)', background: noteOpen || note ? 'var(--surface-raised)' : 'transparent', color:'var(--text-primary)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)', display:'flex', alignItems:'center', gap:6, cursor:'pointer' }}>
              <PXIcon name="sticky-note" size={16} />{note ? 'Note added' : 'Note'}
            </button>
          </div>
          {noteOpen && (
            <div style={{ padding: compact ? '0 12px 8px' : '0 20px 12px' }}>
              <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="Instructions for the barista, e.g. extra hot, half foam" rows={2} style={{ width:'100%', boxSizing:'border-box', resize:'none', background:'var(--surface-card)', border:'1px solid var(--border-strong)', borderRadius:'var(--radius-sm)', color:'var(--text-primary)', fontFamily:'inherit', fontSize:'var(--text-sm)', padding:10, outline:'none' }}></textarea>
            </div>
          )}
          <div style={{ flex:1, minHeight:0, overflowY:'auto', padding: compact ? '0 12px 12px' : '0 20px 20px', display: compact ? 'flex' : 'grid', flexDirection:'column', gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))', gridAutoRows:'min-content', gap: compact ? 8 : 12 }}>
            {groups.map(groupCard)}
          </div>
          <div style={{ flex:'0 0 auto', borderTop:'1px solid var(--border-hairline)', padding: compact ? 12 : '14px 20px', display:'flex', flexDirection: compact ? 'column' : 'row', alignItems: compact ? 'stretch' : 'center', gap:12 }}>
            <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:2 }}>
              <span style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{chosen.map(([o]) => o).join(' · ') || 'No modifiers yet'}</span>
              <span style={{ fontSize:'var(--text-xs)', color: missing.length ? 'var(--status-checkedin)' : 'var(--text-positive)' }}>{missing.length ? 'Choose ' + missing.map((g) => g.name.toLowerCase()).join(', ') : 'Ready to add'}</span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <PXStepper value={qty} onChange={(q) => setQty(Math.max(1, q))} />
              <PXButton variant="outline" size="lg" onClick={onCancel} style={{ flex:'0 0 auto', paddingLeft:18, paddingRight:18 }}>Cancel</PXButton>
              <PXButton size="lg" disabled={missing.length > 0} onClick={add} style={{ flex: compact ? 1 : '0 0 auto', minWidth:0, paddingLeft:18, paddingRight:18 }}>Add {pxMoney(unit * qty)}</PXButton>
            </div>
          </div>
        </div>
      );
    }

    /* ---------- Customer ---------- */
    const PX_PLATFORMS = ['Own driver', 'Uber Eats', 'Rappi', 'DiDi Food'];
    const pxField = { width:'100%', boxSizing:'border-box', height:44, background:'var(--surface-card)', border:'1px solid var(--border-strong)', borderRadius:'var(--radius-sm)', color:'var(--text-primary)', fontFamily:'inherit', fontSize:'var(--text-sm)', padding:'0 12px', outline:'none' };

    function CustomerPanel({ mode, value, onSave, onClose }) {
      const [c, setC] = React.useState(() => ({ name:'', phone:'', address:'', notes:'', platform:'Own driver', ...value }));
      const set = (k) => (e) => setC((x) => ({ ...x, [k]:e.target.value }));
      const del = mode === 'Delivery';
      const ok = c.name.trim() && c.phone.trim() && (!del || c.address.trim());
      const label = (t, req) => <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{t}{req && <span style={{ color:'var(--danger-ink)' }}> *</span>}</span>;
      return (
        <div style={{ position:'absolute', inset:0, zIndex:5, background:'var(--surface-panel)', display:'flex', flexDirection:'column' }}>
          <div style={{ padding:'16px 16px 12px', display:'flex', alignItems:'center', gap:10, borderBottom:'1px solid var(--border-hairline)' }}>
            <PXIcon name={del ? 'bike' : 'shopping-bag'} size={20} />
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>{mode} customer</span>
            <PXIconButton icon="x" size="sm" label="Close" variant="outline" onClick={onClose} style={{ marginLeft:'auto' }} />
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:16, display:'flex', flexDirection:'column', gap:12 }}>
            {del && (
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {label('Platform')}
                <div style={{ display:'grid', gridTemplateColumns:'repeat(2,minmax(0,1fr))', gap:6 }}>
                  {PX_PLATFORMS.map((p) => (
                    <button key={p} onClick={() => setC((x) => ({ ...x, platform:p }))} style={{ height:40, borderRadius:'var(--radius-sm)', border: c.platform === p ? 'none' : '1px solid var(--border-strong)', background: c.platform === p ? 'var(--surface-accent)' : 'transparent', color: c.platform === p ? 'var(--text-on-light)' : 'var(--text-primary)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)', cursor:'pointer' }}>{p}</button>
                  ))}
                </div>
              </div>
            )}
            <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label('Name', true)}<input value={c.name} onChange={set('name')} placeholder="Customer name" style={pxField} /></label>
            <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label('Phone', true)}<input value={c.phone} onChange={set('phone')} placeholder="55 1234 5678" inputMode="tel" style={pxField} /></label>
            {del && <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label('Address', true)}<input value={c.address} onChange={set('address')} placeholder="Street, number, apt" style={pxField} /></label>}
            <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label(del ? 'Delivery notes' : 'Notes')}<textarea value={c.notes} onChange={set('notes')} rows={2} placeholder={del ? 'Gate code, leave at door…' : 'Optional'} style={{ ...pxField, height:'auto', padding:10, resize:'none' }}></textarea></label>
          </div>
          <div style={{ padding:16, borderTop:'1px solid var(--border-hairline)' }}>
            <PXButton block size="lg" disabled={!ok} onClick={() => onSave(c)}>Save customer</PXButton>
          </div>
        </div>
      );
    }

    function CustomerRow({ mode, customer, onEdit }) {
      if (mode === 'Dine here') return null;
      const has = customer && customer.name;
      return (
        <button onClick={onEdit} style={{ margin:'0 16px', width:'calc(100% - 32px)', boxSizing:'border-box', padding:'10px 12px', borderRadius:'var(--radius-md)', border: has ? 'none' : '1.5px dashed var(--status-checkedin)', background: has ? 'var(--surface-card)' : 'transparent', color:'var(--text-primary)', display:'flex', alignItems:'center', gap:10, textAlign:'left', cursor:'pointer' }}>
          <PXIcon name={has ? 'user-round' : 'user-round-plus'} size={18} />
          <span style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:1 }}>
            {has ? (
              <React.Fragment>
                <span style={{ fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)' }}>{customer.name} · {customer.phone}</span>
                <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{mode === 'Delivery' ? customer.platform + ' · ' + customer.address : (customer.notes || 'Pickup at counter')}</span>
              </React.Fragment>
            ) : <span style={{ fontSize:'var(--text-sm)', color:'var(--status-checkedin)' }}>Add customer details · required</span>}
          </span>
          <PXIcon name="pencil" size={14} />
        </button>
      );
    }

    /* ---------- Check timers ---------- */
    const PX_T0 = Date.now();
    const PX_META = {
      412:{ type:'Delivery', openedMin:23, customer:{ name:'Mia Torres', phone:'55 5555 0142', address:'Av. Álvaro Obregón 18, depto 3', platform:'Uber Eats', notes:'' }, prepaid:'Uber Eats' },
      410:{ type:'Pickup', openedMin:4, customer:{ name:'Daniel Ruiz', phone:'55 5555 0177', notes:'' } },
      407:{ type:'Delivery', openedMin:14, customer:{ name:'Grace Kim', phone:'55 5555 0108', address:'Calle Durango 402', platform:'Own driver', notes:'Tocar dos veces' } },
      401:{ type:'Pickup', openedMin:52, closedAfter:18, customer:{ name:'Omar Haddad', phone:'55 5555 0190', notes:'' } },
      400:{ type:'Pickup', openedMin:9, customer:{ name:'Lena Park', phone:'55 5555 0123', notes:'' } },
      396:{ type:'Pickup', openedMin:31, customer:{ name:'Sam Ortiz', phone:'55 5555 0166', notes:'' } },
      391:{ type:'Delivery', openedMin:75, closedAfter:12, customer:{ name:'Ivy Chen', phone:'55 5555 0111', address:'Calle Orizaba 9', platform:'Rappi', notes:'' }, prepaid:'Rappi' },
      390:{ type:'Delivery', openedMin:2, customer:{ name:'Noah Brooks', phone:'55 5555 0155', address:'Av. Insurgentes 77', platform:'DiDi Food', notes:'' }, prepaid:'DiDi Food' },
    };
    const pxOpenedAt = (order) => PX_T0 - ((PX_META[order] || {}).openedMin || 0) * 60000;
    function useNow(ms = 1000) {
      const [now, setNow] = React.useState(Date.now());
      React.useEffect(() => { const t = setInterval(() => setNow(Date.now()), ms); return () => clearInterval(t); }, [ms]);
      return now;
    }
    const pxFmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; const p = (n) => String(n).padStart(2, '0'); return h ? h + ':' + p(m) + ':' + p(x) : p(m) + ':' + p(x); };
    const PX_WARN_MIN = 10, PX_LATE_MIN = 20;

    function ElapsedPill({ order, status, size = 'md' }) {
      const now = useNow();
      const meta = PX_META[order] || {};
      if (status === 'closed') {
        return <span style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:'var(--text-xs)', color:'var(--text-muted)' }}><PXIcon name="timer-off" size={12} />Closed in {meta.closedAfter || 0}m</span>;
      }
      const ms = now - pxOpenedAt(order);
      const min = ms / 60000;
      const tone = min >= PX_LATE_MIN ? 'late' : min >= PX_WARN_MIN ? 'warn' : 'ok';
      const bg = { ok:'var(--surface-raised)', warn:'var(--order-warn)', late:'var(--order-late)' }[tone];
      const fg = tone === 'ok' ? 'var(--text-primary)' : 'var(--text-on-light)';
      return (
        <span title={(status === 'pending' ? 'Pending close' : 'Open') + ' for ' + pxFmt(ms)} style={{ display:'inline-flex', alignItems:'center', gap:5, height: size === 'sm' ? 22 : 26, padding:'0 8px', borderRadius:'var(--radius-pill)', background:bg, color:fg, fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)', fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap' }}>
          <PXIcon name={tone === 'late' ? 'triangle-alert' : 'timer'} size={12} />{pxFmt(ms)}
        </span>
      );
    }

    const PX_TYPE_ICON = { 'Dine here':'utensils', Pickup:'shopping-bag', Delivery:'bike' };
    function OrderTypeTag({ order }) {
      const m = PX_META[order];
      if (!m) return null;
      return (
        <span style={{ display:'flex', alignItems:'center', gap:6, fontSize:'var(--text-xs)', color:'var(--text-secondary)', minWidth:0 }}>
          <PXIcon name={PX_TYPE_ICON[m.type]} size={14} />
          <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.type === 'Delivery' ? m.customer.platform : m.type} · {m.customer.name}</span>
          {m.prepaid && <PrepaidTag />}
        </span>
      );
    }

    function PrepaidTag({ via }) {
      return <span style={{ flex:'0 0 auto', marginLeft:'auto', display:'inline-flex', alignItems:'center', gap:4, height:20, padding:'0 7px', borderRadius:'var(--radius-pill)', background:'var(--mint-200)', color:'var(--text-on-light)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)' }}><PXIcon name="badge-check" size={12} />{via ? 'Paid via ' + via : 'Prepaid'}</span>;
    }

    /* ---------- 86 / sold out ---------- */
    const PX_86_KEY = 'compos-86';
    function useSoldOut() {
      const [list, setList] = React.useState(() => { try { return JSON.parse(localStorage.getItem(PX_86_KEY)) || ['Ramen tonkotsu', 'Salmón glaseado']; } catch (e) { return ['Ramen tonkotsu', 'Salmón glaseado']; } });
      const toggle = (name) => setList((l) => { const n = l.includes(name) ? l.filter((x) => x !== name) : [...l, name]; try { localStorage.setItem(PX_86_KEY, JSON.stringify(n)); } catch (e) {} return n; });
      return { list, isOut:(n) => list.includes(n), toggle };
    }
    function StockCard({ out, manage, onToggle, children }) {
      return (
        <div style={{ position:'relative', minWidth:0, display:'flex', flexDirection:'column' }}>
          <div style={{ opacity: out ? .35 : 1, pointerEvents: out || manage ? 'none' : 'auto', display:'flex', flexDirection:'column', flex:1 }}>{children}</div>
          {out && !manage && <span style={{ position:'absolute', top:8, right:8, display:'inline-flex', alignItems:'center', gap:4, height:22, padding:'0 8px', borderRadius:'var(--radius-pill)', background:'var(--status-danger)', color:'var(--text-on-light)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-bold)' }}><PXIcon name="ban" size={12} />86 · Sold out</span>}
          {manage && (
            <button onClick={onToggle} style={{ position:'absolute', inset:0, borderRadius:'var(--radius-md)', border: out ? '2px solid var(--status-danger)' : '2px dashed var(--border-strong)', background: out ? 'rgba(229,105,95,.12)' : 'rgba(17,19,21,.35)', color: out ? 'var(--danger-ink)' : 'var(--text-primary)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:6, fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', cursor:'pointer' }}>
              <PXIcon name={out ? 'rotate-ccw' : 'ban'} size={20} />{out ? 'Back in stock' : 'Mark sold out'}
            </button>
          )}
        </div>
      );
    }
    function StockToggle({ manage, count, onClick, compact }) {
      return (
        <button onClick={onClick} style={{ flex:'0 0 auto', height: compact ? 44 : 52, padding:'0 14px', borderRadius:'var(--radius-sm)', border: manage ? 'none' : '1.5px solid var(--status-danger)', background: manage ? 'var(--status-danger)' : 'transparent', color: manage ? 'var(--text-on-light)' : 'var(--danger-ink)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
          <PXIcon name={manage ? 'check' : 'ban'} size={18} />{manage ? 'Done' : '86 · ' + count}
        </button>
      );
    }

    /* ---------- Void / refund reasons ---------- */
    const PX_VOID_REASONS = ['Customer cancelled', 'Duplicate order', 'Entered by mistake', 'Item unavailable', 'Payment failed', 'Other'];
    const PX_REFUND_REASONS = ['Wrong item', 'Quality issue', 'Late delivery', 'Missing item', 'Customer cancelled', 'Other'];
    function ReasonChips({ reasons, value, onChange }) {
      return (

<script type="text/babel" data-src="Feedback.jsx">
    const FBds = () => window.ComposDesignSystem_9739cd;

    /* ---------- Toasts ---------- */
    let fbPush = null;

    function ToastHost({ bottom = 20 }) {

        <div style={{ position:'absolute', left:0, right:0, bottom, zIndex:60, display:'flex', flexDirection:'column', alignItems:'center', gap:8, pointerEvents:'none', padding:'0 12px' }}>

              <Toast tone={t.tone} title={t.title} message={t.message} actionLabel={t.actionLabel} onAction={() => { t.onAction && t.onAction(); close(t.id); }} onClose={() => close(t.id)} style={{ width:'100%' }} />

    /* ---------- Manager override ---------- */
    function useOverride() {
      const { ManagerOverride } = FBds();

        send: { tone:'neutral', icon:'chef-hat', title:'Send 3 items to kitchen?', message:'Order #412 moves to Pending Close. You can still add items.', confirmLabel:'Send to kitchen', then:() => window.toast({ tone:'positive', title:'Sent to kitchen', message:'Order #412 · 3 items', actionLabel:'Undo' }) },
        close: { tone:'positive', title:'Close shift?', message:'Counted $6447.00 · variance +$10.00. An end-of-day report will print.', confirmLabel:'Close shift', then:() => window.toast({ tone:'positive', title:'Shift closed' }) },

      const d = dlg && D[dlg];
      return (
        <div style={{ flex:1, minHeight:0, position:'relative', display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ flex:1, overflowY:'auto', padding: compact ? 12 : 20, display:'flex', flexDirection:'column', gap:20 }}>

            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <span style={label}>Toasts · tap to trigger</span>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                {T.map(([tone, title, message, actionLabel]) => <Button key={tone} variant="outline" size="sm" onClick={() => window.toast({ tone, title, message, actionLabel })}>{tone}</Button>)}
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <span style={label}>Confirmation dialogs</span>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                <Button variant="outline" size="sm" onClick={() => setDlg('send')}>Send to kitchen</Button>
                <Button variant="outline" size="sm" onClick={() => setDlg('close')}>Close shift</Button>
                <Button variant="outline" size="sm" onClick={() => setDlg('leave')}>Unsaved changes</Button>
                <Button variant="outline" size="sm" onClick={() => setDlg('delete')} style={{ color:'var(--danger-ink)', borderColor:'var(--danger-ink)' }}>Delete check</Button>
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <span style={label}>Manager override · demo PIN 1234</span>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>

          </div>
          {d && <ConfirmDialog {...strip(d)} onCancel={() => setDlg(null)} onConfirm={() => { setDlg(null); d.then(); }} />}

          <ToastHost />

    }

    Object.assign(window, { ToastHost, useOverride, DiscountDialog, FeedbackShowcase, FB_PIN });

</script>

          <div style={{ flex:1, overflowY:'auto', padding:16, display:'flex', flexDirection:'column', gap:8 }}>
            {lines.length === 0 && (
              <div style={{ margin:'auto', display:'flex', flexDirection:'column', alignItems:'center', gap:10, color:'var(--text-muted)', fontSize:'var(--text-sm)' }}>
                <Icon name="shopping-cart" size={24} />Tap an item to add it to the check.
              </div>
            )}
            {lines.map(([name, v]) => (
              <div key={name} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding:'10px 12px', display:'flex', alignItems:'center', gap:10 }}>
                <span style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}>
                  <span style={{ fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)' }}>{v.name || name}</span>
                  {v.mods && v.mods.length > 0 && <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{v.mods.join(' · ')}</span>}
                  {v.note && <span style={{ fontSize:'var(--text-xs)', color:'var(--status-checkedin)' }}>“{v.note}”</span>}
                  <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{'$' + (v.qty * mlPrice(v.price)).toFixed(2)}</span>
                </span>
                <QuantityStepper value={v.qty} onChange={(q) => setQty(name, v.price, q)} />
              </div>
            ))}
          </div>
          <div style={{ padding:20, borderTop:'1px solid var(--border-hairline)', display:'flex', flexDirection:'column', gap:16 }}>
            <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between' }}>
              <span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)' }}>Total</span>
              <span style={{ fontSize:'var(--text-metric)', fontWeight:'var(--weight-semibold)', letterSpacing:'var(--tracking-tight)' }}>{'$' + total.toFixed(2)}</span>
            </div>
            {prepaid && <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:'var(--text-sm)', color:'var(--text-positive)' }}><Icon name="badge-check" size={16} />Paid in advance via {prepaid} · no payment needed</div>}
            <div style={{ display:'flex', gap:8 }}>
              <Button variant="outline" size="lg" style={{ flex:1, minWidth:0, paddingLeft:12, paddingRight:12 }} disabled={!lines.length} onClick={clear}>New Check</Button>
              <Button size="lg" style={{ flex:1, minWidth:0, paddingLeft:12, paddingRight:12 }} disabled={!lines.length || needsCustomer} onClick={prepaid ? (onPrepaidClose || clear) : onCheckout}>{prepaid ? 'Send & close' : 'Checkout'}</Button>
              {!prepaid && <IconButton icon="credit-card" label="Card payment" size="lg" variant="secondary" disabled={!lines.length || needsCustomer} style={{ flex:'0 0 auto' }} />}
            </div>
          </div>
          {editing && <window.CustomerPanel mode={mode} value={customer} onClose={() => setEditing(false)} onSave={(c) => { setCustomer(c); setEditing(false); }} />}
        </aside>
      );
    }

    function MenuLayout() {
      const [cat, setCat] = React.useState(() => { const h = decodeURIComponent(location.hash.slice(1)); return ML_CATS.some((c) => c.name === h) ? h : ML_CATS[0].name; });
      const [cart, setCart] = React.useState({});
      const [railOpen, setRailOpen] = React.useState(false);
      const [modItem, setModItem] = React.useState(null);
      const [manage, setManage] = React.useState(false);
      const stock = window.useSoldOut();
      const active = ML_CATS.find((c) => c.name === cat);
      const qtyOf = (name) => window.PX_MODS[name] ? Object.values(cart).filter((v) => v.name === name).reduce((s, v) => s + v.qty, 0) : (cart[name] ? cart[name].qty : 0);
      const onDish = (name, price, q) => {
        if (!window.PX_MODS[name]) return setQty(name, price, q);
        if (q > qtyOf(name)) return setModItem({ name, price });
        const k = Object.keys(cart).reverse().find((key) => cart[key].name === name);
        if (k) setQty(k, cart[k].price, cart[k].qty - 1);
      };
      const setQty = (name, price, q) => setCart((c) => { const n = { ...c }; if (q <= 0) delete n[name]; else n[name] = { ...n[name], qty:q, price }; return n; });
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
          <MLTopBar onMenu={() => setRailOpen((o) => !o)} />
          <div style={{ flex:1, minHeight:0, display:'flex', gap:12, padding:'0 12px 12px' }}>
            <MLRail open={railOpen} active="Menu" />
            <main style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}>
              {modItem ? <window.ModifierPanel key={modItem.name} item={modItem.name} basePrice={mlPrice(modItem.price)} onCancel={() => setModItem(null)} onAdd={(v) => { mlAddVariant(setCart, v); setModItem(null); }} /> : <React.Fragment>
              <div style={{ flex:1, overflowY:'auto', padding:20, display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))', gridAutoRows:'min-content', gap:12 }}>
                {active.items.map(([name, price]) => (
                  <window.StockCard key={name} out={stock.isOut(name)} manage={manage} onToggle={() => stock.toggle(name)}>
                    <DishCard name={name} price={price} accent={active.color}
                      qty={qtyOf(name)} onQty={(q) => onDish(name, price, q)} route={window.PX_MODS[name] ? 'Bar · has modifiers' : cat} style={{ minWidth:0, flex:1 }} />
                  </window.StockCard>
                ))}
              </div>
              <div style={{ flex:'0 0 auto', display:'flex', gap:8, overflowX:'auto', padding:'12px 20px 16px', borderTop:'1px solid var(--border-hairline)' }}>
                <window.StockToggle manage={manage} count={stock.list.length} onClick={() => setManage((v) => !v)} />
                {ML_CATS.map((c) => {
                  const on = c.name === cat;
                  return (
                    <button key={c.name} onClick={() => setCat(c.name)} style={{ flex:'0 0 auto', height:52, padding:'0 18px', borderRadius:'var(--radius-sm)', border:`1.5px solid ${window.inkOf(c.color)}`, cursor:'pointer', display:'flex', alignItems:'center', gap:10, background: on ? c.color : 'transparent', color: on ? 'var(--text-on-light)' : window.inkOf(c.color), fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', transition:'background 150ms, color 150ms' }}>
                      <Icon name={c.icon} size={20} />{c.name}
                    </button>
                  );
                })}
              </div>
              </React.Fragment>}
            </main>
            <MLCart cart={cart} setQty={setQty} clear={() => setCart({})} onCheckout={() => mlCheckout('New', cart)} />
          </div>
        </div>
      );
    }
    Object.assign(window, { mlAddVariant, mlCheckout, MLTopBar, MLRail, MLCart, mlPrice, MenuLayout, ML_CATS });

</script>
<script type="text/babel" data-src="SplitLayout.jsx">
    const { Icon: SPIcon, Button: SPButton, IconButton: SPIconButton } = window.ComposDesignSystem_9739cd;

    const spMoney = (n) => '$' + n.toFixed(2);
    const spLoad = () => {
      try { const d = JSON.parse(localStorage.getItem('compos-split-src')); if (d && d.cart && Object.keys(d.cart).length) return d; } catch (e) {}
      const o = window.ORDERS[0];
      return { order:o.order, cart:Object.fromEntries(o.items.map((it) => [it.name, { qty:it.qty, price:it.price, name:it.name, mods:it.mods }])) };
    };

    function useSplit(src) {
      const units = React.useMemo(() => {
        const u = [];
        Object.entries(src.cart).forEach(([key, v]) => { for (let i = 0; i < v.qty; i++) u.push({ id:key + '#' + i, key, name:v.name || key, mods:v.mods, price:window.mlPrice(v.price), unitPrice:v.price }); });
        return u;
      }, [src]);
      const [checks, setChecks] = React.useState(() => [{ id:1, units:units.map((u) => u.id) }]);
      const [sel, setSel] = React.useState([]);
      const [nextId, setNextId] = React.useState(2);
      const byId = Object.fromEntries(units.map((u) => [u.id, u]));
      const toggle = (id) => setSel((s) => s.includes(id) ? s.filter((x) => x !== id) : [...s, id]);
      const selectAll = (cid) => { const c = checks.find((x) => x.id === cid); const all = c.units.every((u) => sel.includes(u)); setSel((s) => all ? s.filter((x) => !c.units.includes(x)) : [...new Set([...s, ...c.units])]); };
      const moveTo = (cid) => { if (!sel.length) return; setChecks((cs) => cs.map((c) => c.id === cid ? { ...c, units:[...c.units.filter((u) => !sel.includes(u)), ...sel] } : { ...c, units:c.units.filter((u) => !sel.includes(u)) })); setSel([]); };
      const newCheck = () => { const id = nextId; setNextId(id + 1); setChecks((cs) => [...cs.map((c) => ({ ...c, units:c.units.filter((u) => !sel.includes(u)) })), { id, units:[...sel] }]); setSel([]); };
      const removeCheck = (cid) => setChecks((cs) => { const gone = cs.find((c) => c.id === cid); return cs.filter((c) => c.id !== cid).map((c, i) => i === 0 ? { ...c, units:[...c.units, ...gone.units] } : c); });
      const total = (c) => c.units.reduce((s, u) => s + byId[u].price, 0);
      const filled = checks.filter((c) => c.units.length);
      const canConfirm = filled.length >= 2;
      const result = () => filled.map((c) => {
        const agg = {};
        c.units.forEach((uid) => { const u = byId[uid]; agg[u.key] = agg[u.key] ? { ...agg[u.key], qty:agg[u.key].qty + 1 } : { qty:1, name:u.name, mods:u.mods, price:u.unitPrice }; });
        return Object.values(agg);
      });
      return { checks, sel, byId, toggle, selectAll, moveTo, newCheck, removeCheck, total, canConfirm, result, labelOf:(c) => 'Check ' + (checks.indexOf(c) + 1) };
    }

    function SPItem({ u, on, onClick }) {
      return (
        <button onClick={onClick} style={{ display:'flex', alignItems:'center', gap:10, minHeight:52, padding:'8px 12px', borderRadius:'var(--radius-sm)', border:'none', background: on ? 'var(--mint-200)' : 'var(--surface-raised)', color: on ? 'var(--text-on-light)' : 'var(--text-primary)', textAlign:'left', cursor:'pointer', flex:'0 0 auto', transition:'background 120ms' }}>
          <span style={{ width:20, height:20, flex:'0 0 auto', borderRadius:5, border: on ? 'none' : '1.5px solid var(--border-strong)', background: on ? 'var(--black-900)' : 'transparent', color:'var(--mint-200)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>{on && <SPIcon name="check" size={13} />}</span>
          <span style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}>
            <span style={{ fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)' }}>{u.name}</span>
            {u.mods && u.mods.length > 0 && <span style={{ fontSize:'var(--text-xs)', opacity:.7 }}>{u.mods.join(' · ')}</span>}
          </span>
          <span style={{ fontSize:'var(--text-sm)', fontVariantNumeric:'tabular-nums' }}>{u.price.toFixed(2)}</span>
        </button>
      );
    }

    function SPCheck({ sp, c, compact }) {
      const idx = sp.checks.indexOf(c);
      const mine = c.units.filter((u) => sp.sel.includes(u)).length;
      const target = sp.sel.length > 0 && mine < sp.sel.length;
      const allOn = c.units.length > 0 && mine === c.units.length;
      return (
        <section style={{ width: compact ? 'auto' : 280, flex:'0 0 auto', minHeight: compact ? 0 : '100%', maxHeight: compact ? 'none' : '100%', display:'flex', flexDirection:'column', background:'var(--surface-card)', borderRadius:'var(--radius-md)', overflow:'hidden', outline: target ? '2px dashed var(--surface-accent)' : 'none', outlineOffset:-2 }}>
          <div style={{ display:'flex', alignItems:'center', gap:8, padding:'12px 14px' }}>
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>Check {idx + 1}</span>
            <span style={{ fontSize:'var(--text-xs)', color:'var(--text-muted)' }}>{c.units.length} items</span>
            {c.units.length > 0 && <button onClick={() => sp.selectAll(c.id)} style={{ marginLeft:'auto', border:'none', background:'transparent', color:'var(--text-link)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)', cursor:'pointer', padding:4 }}>{allOn ? 'Clear' : 'Select all'}</button>}
            {idx > 0 && <SPIconButton icon="x" size="sm" label="Remove check" variant="outline" onClick={() => sp.removeCheck(c.id)} style={{ marginLeft: c.units.length ? 0 : 'auto' }} />}
          </div>
          {target && (
            <button onClick={() => sp.moveTo(c.id)} style={{ margin:'0 12px 8px', height:44, flex:'0 0 auto', borderRadius:'var(--radius-sm)', border:'none', background:'var(--surface-accent)', color:'var(--text-on-light)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', display:'flex', alignItems:'center', justifyContent:'center', gap:8, cursor:'pointer' }}>
              <SPIcon name="arrow-down-to-line" size={16} />Move {sp.sel.length - mine} here
            </button>
          )}
          <div style={{ flex:1, minHeight:0, overflowY: compact ? 'visible' : 'auto', padding:'0 12px 12px', display:'flex', flexDirection:'column', gap:6 }}>
            {c.units.map((uid) => <SPItem key={uid} u={sp.byId[uid]} on={sp.sel.includes(uid)} onClick={() => sp.toggle(uid)} />)}
            {c.units.length === 0 && <span style={{ padding:'16px 4px', fontSize:'var(--text-sm)', color:'var(--text-muted)', textAlign:'center' }}>Empty · select items and move them here</span>}
          </div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', padding:'12px 14px', borderTop:'1px solid var(--border-hairline)', background:'var(--surface-panel)' }}>
            <span style={{ fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>Total</span>
            <span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)', fontVariantNumeric:'tabular-nums' }}>{spMoney(sp.total(c))}</span>
          </div>
        </section>
      );
    }

    function SplitBoard({ src, compact, onBack, onConfirm }) {
      const sp = useSplit(src);
      const hint = sp.sel.length ? sp.sel.length + ' selected · tap “Move here” on a check or create a new one' : 'Tap item(s) to select';
      const newCol = (
        <button onClick={sp.newCheck} style={{ width: compact ? 'auto' : 220, minHeight: compact ? 72 : '100%', flex:'0 0 auto', borderRadius:'var(--radius-md)', border:'2px dashed ' + (sp.sel.length ? 'var(--surface-accent)' : 'var(--border-dashed)'), background:'transparent', color: sp.sel.length ? 'var(--accent-ink)' : 'var(--text-secondary)', display:'flex', flexDirection: compact ? 'row' : 'column', alignItems:'center', justifyContent:'center', gap:12, cursor:'pointer', fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>
          <SPIcon name="circle-plus" size={compact ? 22 : 40} />{sp.sel.length ? 'New check with ' + sp.sel.length : 'Create new check'}
        </button>
      );
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column' }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, padding: compact ? '12px 12px 8px' : '16px 20px' }}>
            <SPIconButton icon="arrow-left" label="Back to checks" variant="secondary" onClick={onBack} />
            <span style={{ display:'flex', flexDirection:'column' }}>
              <span style={{ fontSize: compact ? 'var(--text-h3)' : 'var(--text-h1)', fontWeight:'var(--weight-semibold)' }}>Split check</span>
              <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>Order #{src.order} · {sp.checks.length} checks</span>
            </span>
          </div>
          <div style={{ flex:1, minHeight:0, display:'flex', flexDirection: compact ? 'column' : 'row', gap:12, overflowX: compact ? 'hidden' : 'auto', overflowY: compact ? 'auto' : 'hidden', padding: compact ? '0 12px 12px' : '0 20px 16px' }}>
            {sp.checks.map((c) => <SPCheck key={c.id} sp={sp} c={c} compact={compact} />)}
            {newCol}
          </div>
          <div style={{ flex:'0 0 auto', display:'flex', flexDirection: compact ? 'column' : 'row', alignItems: compact ? 'stretch' : 'center', gap:12, padding: compact ? 12 : '14px 20px', borderTop:'1px solid var(--border-hairline)' }}>
            <span style={{ flex:1, fontSize:'var(--text-sm)', color: sp.sel.length ? 'var(--text-primary)' : 'var(--text-secondary)' }}>{hint}</span>
            <SPButton size="lg" disabled={!sp.canConfirm} onClick={() => onConfirm(sp.result())} style={{ minWidth: compact ? 0 : 240 }}>Confirm split</SPButton>
          </div>
        </div>
      );
    }

    function SplitLayout() {
      const [src] = React.useState(spLoad);
      const [railOpen, setRailOpen] = React.useState(false);
      const back = () => { location.href = 'Orders Layout.html'; };
      const confirm = (checks) => { try { localStorage.setItem('compos-split', JSON.stringify({ order:src.order, checks })); } catch (e) {} back(); };
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
          <window.MLTopBar active="CHECKS" onMenu={() => setRailOpen((o) => !o)} />
          <div style={{ flex:1, minHeight:0, display:'flex', gap:12, padding:'0 12px 12px' }}>
            <window.MLRail open={railOpen} active="Orders" />
            <main style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}>
              <SplitBoard src={src} onBack={back} onConfirm={confirm} />
            </main>
          </div>
        </div>
      );
    }
    Object.assign(window, { SplitLayout, SplitBoard, spLoad });

</script>
<script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<SplitLayout />);
</script>
