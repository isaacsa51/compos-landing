<script type="text/babel" data-src="AuthScreen.jsx">
    const { Avatar, PinDots, NumericKeypad } = window.ComposDesignSystem_9739cd;

    function AuthScreen({ onAuthed }) {
      const [who, setWho] = React.useState('Lena P.');
      const [pin, setPin] = React.useState('');
      const push = (k) => {
        if (k === 'del') return setPin((p) => p.slice(0, -1));
        if (k === '.') return;
        const next = (pin + k).slice(0, 4);
        setPin(next);
        if (next.length === 4) setTimeout(() => onAuthed(who), 260);
      };
      return (
        <div style={{ display:'flex', gap:24, padding:'8px 24px 24px 0', height:'100%' }}>
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:12, paddingTop:56 }}>
            {window.STAFF.map((s, i) => (
              <button key={s} onClick={() => { setWho(s); setPin(''); }} style={{
                display:'flex', alignItems:'center', gap:16, height:88, padding:'0 20px', cursor:'pointer',
                borderRadius:'var(--radius-md)', textAlign:'left',
                border: who === s ? '1.5px solid transparent' : '1.5px solid rgba(255,255,255,.34)',
                background: who === s ? 'var(--periwinkle-200)' : 'transparent',
                color: who === s ? 'var(--text-on-light)' : 'var(--text-primary)',
                fontFamily:'var(--font-ui)', fontSize:'var(--text-h2)',
                transition:'background var(--duration-base) var(--ease-standard)',
              }}>
                <Avatar name={s} tone={who === s ? 'var(--white)' : i} size={46} />{s}
              </button>
            ))}
          </div>
          <div style={{ flex:1, background:'var(--surface-panel)', borderRadius:'var(--radius-md)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:32 }}>
            <span style={{ fontSize:'var(--text-h3)', color:'var(--text-secondary)' }}>Enter your PIN</span>
            <PinDots filled={pin.length} length={4} style={{ gap:'var(--space-8)' }} />
            <NumericKeypad decimal={false} keySize={84} onKey={push} style={{ width:340 }} />
          </div>
        </div>
      );
    }
    Object.assign(window, { AuthScreen });

</script>
<script type="text/babel" data-src="MenuScreen.jsx">
    const { CategoryTile, DishCard, TotalsPanel, PaymentMethodPicker, Button, Badge, IconButton } = window.ComposDesignSystem_9739cd;

    function MenuScreen({ cart, setCart, onPlace }) {
      const [cat, setCat] = React.useState('Platos fuertes');
      const setQty = (name, price, v) => setCart((c) => {
        const next = { ...c };
        if (v <= 0) delete next[name]; else next[name] = { qty:v, price };
        return next;
      });
      const lines = Object.entries(cart);
      const subtotal = lines.reduce((s,[,v]) => s + v.qty * parseFloat(v.price.slice(1)), 0);
      const tax = subtotal - subtotal / 1.16;
      return (
        <div style={{ display:'flex', gap:16, height:'100%', paddingRight:24 }}>
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:12, overflow:'hidden' }}>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
              {window.CATEGORIES.map((c) => (
                <CategoryTile key={c.name} {...c} selected={c.name === cat} onClick={() => setCat(c.name)} style={{ minWidth:0, height:88 }} />
              ))}
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12, overflowY:'auto' }}>
              {window.DISHES.map((d) => (
                <DishCard key={d.name} {...d} qty={cart[d.name] ? cart[d.name].qty : 0}
                  onQty={(v) => setQty(d.name, d.price, v)} style={{ minWidth:0 }} />
              ))}
            </div>
          </div>
          <aside style={{ width:264, flex:'0 0 auto', display:'flex', flexDirection:'column', gap:12 }}>
            <div style={{ display:'flex', flexDirection:'column', gap:8, minHeight:120 }}>
              {lines.length === 0 && <span style={{ fontSize:'var(--text-sm)', color:'var(--text-muted)' }}>Tap a dish to start the order.</span>}
              {lines.map(([name, v]) => (
                <div key={name} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-sm)', padding:'10px 12px', display:'flex', alignItems:'center', gap:10, fontSize:'var(--text-sm)' }}>
                  <Badge tone="inverse">{v.qty}</Badge>
                  <span style={{ flex:1 }}>{name}</span>
                  <span style={{ color:'var(--text-secondary)' }}>{'$' + (v.qty * parseFloat(v.price.slice(1))).toFixed(2)}</span>
                </div>
              ))}
            </div>
            <div style={{ marginTop:'auto', display:'flex', flexDirection:'column', gap:16 }}>
              <TotalsPanel lines={[{ label:'Subtotal', value:'$' + subtotal.toFixed(2) }, { label:'Tax 10%', value:'$' + tax.toFixed(2) }]} total={'$' + subtotal.toFixed(2)} />
              <PaymentMethodPicker value="wallet" />
              <Button block size="lg" onClick={onPlace} disabled={lines.length === 0}>Place Order</Button>
            </div>
          </aside>
        </div>
      );
    }
    Object.assign(window, { MenuScreen });

</script>

</script>
<script type="text/babel" data-src="TablesScreen.jsx">

                <div key={name} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:'var(--radius-sm)', fontSize:'var(--text-sm)', background: sel === code ? 'var(--surface-raised)' : 'transparent' }}>

<script type="text/babel" data-src="PaymentScreen.jsx">
    const { TotalsPanel, PaymentMethodPicker, NumericKeypad, NfcPrompt, Button, IconButton } = window.ComposDesignSystem_9739cd;

    function PaymentScreen({ order, onDone }) {
      const [method, setMethod] = React.useState('cash');
      const [amount, setAmount] = React.useState('150.00');
      const push = (k) => setAmount((a) => k === 'del' ? a.slice(0, -1) : (a + k).slice(0, 8));
      return (
        <div style={{ display:'flex', gap:16, height:'100%', paddingRight:24 }}>
          <div style={{ width:280, flex:'0 0 auto', display:'flex', flexDirection:'column', gap:16 }}>
            <div style={{ display:'flex', alignItems:'flex-start' }}>
              <span>
                <span style={{ display:'block', fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)' }}>Table {order.table}</span>
                <span style={{ display:'block', fontSize:'var(--text-sm)', color:'var(--text-muted)' }}>Lena P.</span>
              </span>
              <IconButton icon="pencil" variant="outline" label="Edit order" style={{ marginLeft:'auto', borderRadius:'var(--radius-pill)' }} />
            </div>
            <div style={{ background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding:16, flex:1, display:'flex', flexDirection:'column' }}>
              <span style={{ fontSize:'var(--text-h3)', marginBottom:12 }}>Order #{order.order}</span>
              <TotalsPanel lines={[{ label:'Subtotal', value:'$1,629.31' },{ label:'Tax 10%', value:'$260.69' },{ label:'Tips', value:'$' + (parseFloat(amount) || 0).toFixed(2) }]} total="$2,040.00" />
              <div style={{ marginTop:'auto', display:'flex', flexDirection:'column', gap:16 }}>
                <TotalsPanel lines={[{ label:'Received', value:'$2,500.00' },{ label:'Change', value:'-$460.00' }]} total="" totalLabel="" style={{ borderTop:'1px dashed var(--border-dashed)', paddingTop:12 }} />
                <PaymentMethodPicker value={method} onChange={setMethod} />
              </div>
            </div>
          </div>
          <div style={{ flex:1, background:'var(--surface-panel)', borderRadius:'var(--radius-md)', padding:24, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:24 }}>
            {method === 'card' ? (
              <>
                <NfcPrompt />
                <Button variant="outline" size="lg" style={{ width:280 }} onClick={onDone}>Cancel</Button>
              </>
            ) : (
              <>
                <span style={{ fontSize:'var(--text-body)', color:'var(--text-secondary)' }}>{method === 'cash' ? 'Tips amount' : 'Scan the QR code'}</span>
                <span style={{ fontSize:44, fontWeight:'var(--weight-medium)' }}>{amount || '0'}</span>
                <NumericKeypad onKey={push} keySize={62} style={{ width:300 }} />
                <div style={{ display:'flex', alignItems:'center', gap:24 }}>
                  <Button variant="ghost" size="lg">Print Receipt</Button>
                  <Button size="lg" style={{ width:170 }} onClick={onDone}>Apply</Button>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }
    Object.assign(window, { PaymentScreen });

</script>
<script type="text/babel" data-src="AppShell.jsx">
    const { Sidebar, TopBar, Button, Select } = window.ComposDesignSystem_9739cd;

    function App() {
      const [authed, setAuthed] = React.useState(false);
      const [screen, setScreen] = React.useState('Orders');
      const [cart, setCart] = React.useState({});
      const [payOrder, setPayOrder] = React.useState(null);

      const titles = { Menu:'Menu', Orders:'Orders', Reservation:'Reservation', Dashboard:'Dashboard', Tables:'Tables', Chat:'Chat', Accounting:'Accounting', Settings:'Settings' };
      const actions = {
        Orders: <><Select value="Current" size="sm" /><Button size="sm" variant="outline" shape="rounded" onClick={() => setScreen('Tables')}>Layout of halls</Button></>,
        Reservation: <Button size="sm">New reservation</Button>,
        Dashboard: <Select value="Feb 4, 2023" />,
      };

      let body = null;
      if (!authed) body = <window.AuthScreen onAuthed={() => { setAuthed(true); setScreen('Orders'); }} />;
      else if (payOrder) body = <window.PaymentScreen order={payOrder} onDone={() => setPayOrder(null)} />;
      else if (screen === 'Menu') body = <window.MenuScreen cart={cart} setCart={setCart} onPlace={() => { setCart({}); setScreen('Orders'); }} />;
      else if (screen === 'Orders') body = <window.OrdersScreen onPay={setPayOrder} />;
      else if (screen === 'Reservation') body = <window.ReservationScreen />;
      else if (screen === 'Tables') body = <window.TablesScreen onBack={() => setScreen('Orders')} />;
      else if (screen === 'Dashboard') body = <window.DashboardScreen />;
      else body = <div style={{ color:'var(--text-muted)', fontSize:'var(--text-body)', paddingTop:40 }}>
        {screen} is part of the product but was not shown in the source kit — intentionally left blank.
      </div>;

      const header = !authed
        ? <div style={{ display:'flex', alignItems:'center', gap:28, color:'var(--text-primary)', fontFamily:'var(--font-ui)' }}>
            <span style={{ fontSize:'var(--text-h3)' }}>Shift 2</span>
            <span style={{ fontSize:'var(--text-sm)', color:'var(--text-muted)' }}>Monday, 6 Feb 2023 &nbsp;•&nbsp; 8:23 AM</span>
          </div>
        : payOrder ? null
        : <TopBar title={titles[screen]} search={screen !== 'Dashboard' && screen !== 'Orders'} actions={actions[screen]} />;

      return (
        <div style={{ display:'flex', height:'100%', background:'var(--surface-canvas)' }}>
          <Sidebar items={window.NAV} active={screen} onNavigate={(s) => { setPayOrder(null); setScreen(s); }}
            staff={authed ? window.STAFF : []} />
          <main style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:16, padding:'20px 0 20px 8px' }}>
            {header}
            <div style={{ flex:1, minHeight:0 }}>{body}</div>
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</script>
