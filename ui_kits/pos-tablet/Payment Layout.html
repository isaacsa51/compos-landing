<head>

    <meta name="robots" content="noindex">
    <title>Compos — Cobrar</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="../theme.js"></script>
    <style>
        html,body{margin:0;height:100%}body{background:var(--surface-canvas);font-family:var(--font-ui);color:var(--text-primary)}#root{height:100vh;min-height:700px}button{font-family:inherit}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible{outline:2px solid var(--surface-accent);outline-offset:2px}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:6px}

            integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"

<body>
<div id="root"></div>

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.V2Payment));

<script>

</script>
