<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Compos · Pantallas de teléfono</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        :root{color-scheme:dark}
        *{box-sizing:border-box}
        body{margin:0;background:#111315;color:#fff;font-family:var(--font-ui)}
        header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:28px 32px 8px;max-width:1440px;margin:0 auto}
        h1{font-family:var(--font-display);font-size:32px;letter-spacing:-.02em;font-weight:600;margin:0;flex:1 1 320px}
        header p{margin:6px 0 0;color:#ABABAB;font-size:15px;font-family:var(--font-ui);font-weight:400;letter-spacing:0}
        a.lnk{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:14px;font-weight:500}
        a.lnk:hover{background:#292C2D}
        a.lnk.go{background:#fff;color:#111315;border-color:#fff}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:40px 28px;padding:32px;max-width:1440px;margin:0 auto}
        figure{margin:0;display:flex;flex-direction:column;gap:14px;align-items:center}
        .pf{width:100%;max-width:290px;background:#000;border-radius:46px;padding:7px;box-shadow:0 0 0 2px #2B2E30}
        .scr{position:relative;aspect-ratio:390/844;border-radius:39px;overflow:hidden;background:#111315}
        .scr iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform-origin:0 0}
        figcaption{text-align:center;display:flex;flex-direction:column;gap:4px}
        figcaption b{font-size:16px;font-weight:600}
        figcaption a{color:#C9CAEF;font-size:14px;text-decoration:none}
        figcaption a:hover{text-decoration:underline}
        figcaption span{color:#969696;font-size:13px}
        @media (max-width:600px){header,.grid{padding-left:16px;padding-right:16px}}
    </style>
</head>
<body>
<header>
    <h1>Pantallas de teléfono<p>Las 12 pantallas de la demo, en vivo. Cada una funciona: toca, escribe y navega.</p></h1>
    <a class="lnk go" href="../../demo.html#signin-telefono">Demo guiada en teléfono</a>
    <a class="lnk" href="../../index.html#telefono">Volver al sitio</a>
</header>
<main class="grid" id="grid"></main>
<script>
    (function () {
      var S = [['signin', 'index.html', 'Entra con tu PIN', 'Abrir'], ['shift', 'Shift.html', 'Abre el turno', 'Abrir'], ['incoming', 'Incoming.html', 'Acepta pedidos a domicilio', 'Tomar'],
        ['menu', 'Menu.html', 'Arma una orden', 'Tomar'], ['orders', 'Orders.html', 'Maneja los checks', 'Operar'], ['kitchen', 'Kitchen.html', 'Manda a cocina', 'Operar'],
        ['search', 'Search.html', 'Encuentra lo que sea', 'Operar'], ['split', 'Split.html', 'Divide la cuenta', 'Cobrar'], ['payment', 'Payment.html', 'Cobra', 'Cobrar'],
        ['refund', 'Refund.html', 'Reembolsa con autorización', 'Cobrar'], ['reports', 'Reports.html', 'Cierra con reportes', 'Cerrar'], ['settings', 'Settings.html', 'Configura el negocio', 'Cerrar']];
      var g = document.getElementById('grid');
      g.innerHTML = S.map(function (s) {
        return '<figure><div class="pf"><div class="scr"><iframe loading="lazy" title="' + s[2] + '" src="' + s[1] + '"></iframe></div></div>' +
          '<figcaption><span>' + s[3] + '</span><b>' + s[2] + '</b><a href="../../demo.html#' + s[0] + '-telefono">Abrir en la demo guiada</a></figcaption></figure>';
      }).join('');
      var fit = function () { document.querySelectorAll('.scr').forEach(function (b) { b.firstChild.style.transform = 'scale(' + (b.clientWidth / 390) + ')'; }); };
      new ResizeObserver(fit).observe(g); fit();
    })();
</script>
</body>
</html>
