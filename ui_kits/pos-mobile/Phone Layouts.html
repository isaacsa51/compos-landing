<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Compos — Phone layouts</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="../theme.js"></script>
    <style>
        html,body{margin:0}body{background:var(--light-canvas);font-family:var(--font-ui);color:var(--text-primary)}button{font-family:inherit}button:disabled{opacity:.45}a{color:var(--text-link)}a:hover{color:var(--black-900)}::-webkit-scrollbar{width:0;height:0}
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
            integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"

    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"

            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
            integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
            crossorigin="anonymous"></script>
    <script src="../../_ds_bundle.js"></script>
    <script src="../i18n.js"></script>
    <script src="../pos-tablet/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-src="PhoneFrame.jsx">
    function PhoneFrame({ children, dark = true }) {
      return (
        <div style={{ width:390, height:844, borderRadius:44, background:'var(--surface-canvas)', border:'8px solid #2B2E30',
          position:'relative', overflow:'hidden', display:'flex', flexDirection:'column', flex:'0 0 auto' }}>
          <div style={{ height:46, display:'flex', alignItems:'center', padding:'0 26px', fontSize:14, fontWeight:600, color:'var(--text-primary)', fontFamily:'var(--font-ui)' }}>
            9:41
            <span style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', top:10, width:112, height:30, borderRadius:20, background:'#000' }} />
            <span style={{ marginLeft:'auto', display:'inline-flex', gap:5, alignItems:'center' }}>
              <span style={{ width:16, height:10, borderRadius:2, background:'currentColor', opacity:.9 }} />
              <span style={{ width:14, height:10, borderRadius:2, background:'currentColor', opacity:.9 }} />
              <span style={{ width:22, height:11, borderRadius:3, border:'1px solid currentColor', opacity:.9 }} />
            </span>
          </div>
          <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column' }}>{children}</div>
          <div style={{ height:22, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ width:134, height:5, borderRadius:3, background:'var(--text-primary)', opacity:.9 }} />
          </div>
        </div>
      );
    }
    Object.assign(window, { PhoneFrame });

</script>
<script type="text/babel" data-src="../pos-tablet/PosExtras.jsx">
    const { Icon: PXIcon, Button: PXButton, IconButton: PXIconButton, Badge: PXBadge, QuantityStepper: PXStepper } = window.ComposDesignSystem_9739cd;

    /* ---------- Modifiers ---------- */
    const PX_SIZE = { id:'size', name:'Tamaño', min:1, max:1, options:[['Chico',0],['Mediano',20],['Grande',40]] };
    const PX_TEMP = { id:'temp', name:'Base', min:1, max:1, options:[['Arroz',0],['Fideos',0]] };
    const PX_ICE = { id:'ice', name:'Tipo de fideo', min:1, max:1, options:[['Udon',0],['Ramen',0],['Soba',0]] };
    const PX_MILK = { id:'milk', name:'Proteína', min:1, max:1, options:[['Pollo',0],['Res',15],['Salmón',35],['Camarón',35],['Tofu',0]] };
    const PX_EXTRAS = { id:'extras', name:'Extras', min:0, max:3, options:[['Extra proteína',45],['Sin cebollín',0],['Aguacate',25],['Huevo marinado',20],['Alga nori',15],['Ajonjolí',10]] };
    const PX_SWEET = { id:'sweet', name:'Picante', min:0, max:1, options:[['Sin picante',0],['Suave',0],['Medio',0],['Muy picante',0]] };
    const pxOptMilk = { ...PX_MILK, min:0, name:'Proteína extra' };
    const PX_ICE_DEP = { ...PX_ICE, dependsOn:{ group:'temp', value:'Fideos' } };
    const PX_MODS = {
      'Bowl teriyaki': [PX_SIZE, PX_TEMP, PX_ICE_DEP, PX_MILK, PX_EXTRAS, PX_SWEET],
      'Bowl spicy tuna': [PX_SIZE, PX_MILK, PX_EXTRAS, PX_SWEET],
      'Bowl katsu': [PX_SIZE, PX_TEMP, PX_ICE_DEP, PX_MILK, PX_EXTRAS],
      'Ramen miso': [PX_SIZE, PX_TEMP, PX_ICE_DEP, pxOptMilk, PX_EXTRAS, PX_SWEET],
      'Ramen tonkotsu': [PX_SIZE, PX_TEMP, PX_ICE_DEP, PX_MILK, PX_EXTRAS],
      'Yakisoba': [PX_SIZE, PX_ICE, pxOptMilk, PX_EXTRAS, PX_SWEET],
    };
    const pxMoney = (n) => '$' + n.toFixed(2);
    const pxRule = (g) => g.min > 0 ? (g.max === 1 ? 'Required · Pick 1' : 'Required · ' + g.min + '–' + g.max) : (g.max === 1 ? 'Optional · Pick 1' : 'Optional · Up to ' + g.max);

    function ModifierPanel({ item, basePrice, onCancel, onAdd, compact }) {
      const all = PX_MODS[item] || [];
      const [sel, setSel] = React.useState(() => ({ size:['Chico'] }));
      const [qty, setQty] = React.useState(1);
      const [note, setNote] = React.useState('');
      const [noteOpen, setNoteOpen] = React.useState(false);
      const groups = all.filter((g) => !g.dependsOn || (sel[g.dependsOn.group] || []).includes(g.dependsOn.value));
      const toggle = (g, opt) => setSel((s) => {
        const cur = s[g.id] || [];
        let next;
        if (cur.includes(opt)) next = g.min === 1 && g.max === 1 ? cur : cur.filter((x) => x !== opt);
        else next = g.max === 1 ? [opt] : (cur.length >= g.max ? cur : [...cur, opt]);
        return { ...s, [g.id]:next };
      });
      const missing = groups.filter((g) => (sel[g.id] || []).length < g.min);
      const chosen = groups.flatMap((g) => (sel[g.id] || []).map((o) => [o, g.options.find((x) => x[0] === o)[1]]));
      const unit = basePrice + chosen.reduce((s, [, d]) => s + d, 0);
      const add = () => onAdd({ name:item, unit, qty, mods:chosen.map(([o]) => o), note:note.trim() });
      const groupCard = (g) => {
        const cur = sel[g.id] || [];
        const ok = cur.length >= g.min;
        return (
          <section key={g.id} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding: compact ? 12 : 14, display:'flex', flexDirection:'column', gap:10, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8 }}>
              <span style={{ fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>{g.name}</span>
              {g.dependsOn && <PXBadge tone="neutral">If {g.dependsOn.value}</PXBadge>}
              <span style={{ marginLeft:'auto', fontSize:'var(--text-xs)', color: g.min > 0 && !ok ? 'var(--status-checkedin)' : 'var(--text-muted)', display:'flex', alignItems:'center', gap:4 }}>
                {g.min > 0 && ok && <PXIcon name="check" size={12} />}{pxRule(g)}
              </span>
            </div>
            <div style={{ display: compact ? 'flex' : 'grid', flexWrap:'wrap', gridTemplateColumns:'minmax(0,1fr)', gap:8 }}>
              {g.options.map(([o, d]) => {
                const on = cur.includes(o);
                const full = !on && g.max > 1 && cur.length >= g.max;
                return (
                  <button key={o} onClick={() => toggle(g, o)} disabled={full} style={{ minHeight: compact ? 44 : 52, padding:'0 14px', borderRadius:'var(--radius-sm)', border: on ? 'none' : '1px solid var(--border-strong)', background: on ? 'var(--mint-200)' : 'transparent', color: on ? 'var(--text-on-light)' : 'var(--text-primary)', display:'flex', alignItems:'center', gap:10, fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)', cursor: full ? 'not-allowed' : 'pointer', textAlign:'left', flex: compact ? '0 0 auto' : undefined }}>
                    {!compact && <span style={{ width:18, height:18, flex:'0 0 auto', borderRadius: g.max === 1 ? 9 : 5, border: on ? 'none' : '1.5px solid var(--border-strong)', background: on ? 'var(--black-900)' : 'transparent', color:'var(--mint-200)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>{on && <PXIcon name="check" size={12} />}</span>}
                    <span style={{ flex:1 }}>{o}</span>
                    {d > 0 && <span style={{ fontSize:'var(--text-xs)', opacity:.75 }}>+{d.toFixed(2)}</span>}
                  </button>
                );
              })}
            </div>
          </section>
        );
      };
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column' }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, padding: compact ? '12px 12px 8px' : '16px 20px' }}>
            <PXIconButton icon="arrow-left" label="Back to menu" variant="secondary" onClick={onCancel} />
            <span style={{ display:'flex', flexDirection:'column', minWidth:0 }}>
              <span style={{ fontSize: compact ? 'var(--text-h3)' : 'var(--text-h1)', fontWeight:'var(--weight-semibold)' }}>{item}</span>
              <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>From {pxMoney(basePrice)} · {all.filter((g) => g.min > 0).length} required choices</span>
            </span>
            <button onClick={() => setNoteOpen((v) => !v)} style={{ marginLeft:'auto', height:40, padding:'0 14px', borderRadius:'var(--radius-pill)', border:'1px solid var(--border-strong)', background: noteOpen || note ? 'var(--surface-raised)' : 'transparent', color:'var(--text-primary)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)', display:'flex', alignItems:'center', gap:6, cursor:'pointer' }}>
              <PXIcon name="sticky-note" size={16} />{note ? 'Note added' : 'Note'}
            </button>
          </div>
          {noteOpen && (
            <div style={{ padding: compact ? '0 12px 8px' : '0 20px 12px' }}>
              <textarea value={note} onChange={(e) => setNote(e.target.value)} placeholder="Instructions for the barista, e.g. extra hot, half foam" rows={2} style={{ width:'100%', boxSizing:'border-box', resize:'none', background:'var(--surface-card)', border:'1px solid var(--border-strong)', borderRadius:'var(--radius-sm)', color:'var(--text-primary)', fontFamily:'inherit', fontSize:'var(--text-sm)', padding:10, outline:'none' }}></textarea>
            </div>
          )}
          <div style={{ flex:1, minHeight:0, overflowY:'auto', padding: compact ? '0 12px 12px' : '0 20px 20px', display: compact ? 'flex' : 'grid', flexDirection:'column', gridTemplateColumns:'repeat(auto-fill,minmax(190px,1fr))', gridAutoRows:'min-content', gap: compact ? 8 : 12 }}>
            {groups.map(groupCard)}
          </div>
          <div style={{ flex:'0 0 auto', borderTop:'1px solid var(--border-hairline)', padding: compact ? 12 : '14px 20px', display:'flex', flexDirection: compact ? 'column' : 'row', alignItems: compact ? 'stretch' : 'center', gap:12 }}>
            <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:2 }}>
              <span style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{chosen.map(([o]) => o).join(' · ') || 'No modifiers yet'}</span>
              <span style={{ fontSize:'var(--text-xs)', color: missing.length ? 'var(--status-checkedin)' : 'var(--text-positive)' }}>{missing.length ? 'Choose ' + missing.map((g) => g.name.toLowerCase()).join(', ') : 'Ready to add'}</span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <PXStepper value={qty} onChange={(q) => setQty(Math.max(1, q))} />
              <PXButton variant="outline" size="lg" onClick={onCancel} style={{ flex:'0 0 auto', paddingLeft:18, paddingRight:18 }}>Cancel</PXButton>
              <PXButton size="lg" disabled={missing.length > 0} onClick={add} style={{ flex: compact ? 1 : '0 0 auto', minWidth:0, paddingLeft:18, paddingRight:18 }}>Add {pxMoney(unit * qty)}</PXButton>
            </div>
          </div>
        </div>
      );
    }

    /* ---------- Customer ---------- */
    const PX_PLATFORMS = ['Own driver', 'Uber Eats', 'Rappi', 'DiDi Food'];
    const pxField = { width:'100%', boxSizing:'border-box', height:44, background:'var(--surface-card)', border:'1px solid var(--border-strong)', borderRadius:'var(--radius-sm)', color:'var(--text-primary)', fontFamily:'inherit', fontSize:'var(--text-sm)', padding:'0 12px', outline:'none' };

    function CustomerPanel({ mode, value, onSave, onClose }) {
      const [c, setC] = React.useState(() => ({ name:'', phone:'', address:'', notes:'', platform:'Own driver', ...value }));
      const set = (k) => (e) => setC((x) => ({ ...x, [k]:e.target.value }));
      const del = mode === 'Delivery';
      const ok = c.name.trim() && c.phone.trim() && (!del || c.address.trim());
      const label = (t, req) => <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{t}{req && <span style={{ color:'var(--danger-ink)' }}> *</span>}</span>;
      return (
        <div style={{ position:'absolute', inset:0, zIndex:5, background:'var(--surface-panel)', display:'flex', flexDirection:'column' }}>
          <div style={{ padding:'16px 16px 12px', display:'flex', alignItems:'center', gap:10, borderBottom:'1px solid var(--border-hairline)' }}>
            <PXIcon name={del ? 'bike' : 'shopping-bag'} size={20} />
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>{mode} customer</span>
            <PXIconButton icon="x" size="sm" label="Close" variant="outline" onClick={onClose} style={{ marginLeft:'auto' }} />
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:16, display:'flex', flexDirection:'column', gap:12 }}>
            {del && (
              <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
                {label('Platform')}
                <div style={{ display:'grid', gridTemplateColumns:'repeat(2,minmax(0,1fr))', gap:6 }}>
                  {PX_PLATFORMS.map((p) => (
                    <button key={p} onClick={() => setC((x) => ({ ...x, platform:p }))} style={{ height:40, borderRadius:'var(--radius-sm)', border: c.platform === p ? 'none' : '1px solid var(--border-strong)', background: c.platform === p ? 'var(--surface-accent)' : 'transparent', color: c.platform === p ? 'var(--text-on-light)' : 'var(--text-primary)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-medium)', cursor:'pointer' }}>{p}</button>
                  ))}
                </div>
              </div>
            )}
            <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label('Name', true)}<input value={c.name} onChange={set('name')} placeholder="Customer name" style={pxField} /></label>
            <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label('Phone', true)}<input value={c.phone} onChange={set('phone')} placeholder="55 1234 5678" inputMode="tel" style={pxField} /></label>
            {del && <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label('Address', true)}<input value={c.address} onChange={set('address')} placeholder="Street, number, apt" style={pxField} /></label>}
            <label style={{ display:'flex', flexDirection:'column', gap:6 }}>{label(del ? 'Delivery notes' : 'Notes')}<textarea value={c.notes} onChange={set('notes')} rows={2} placeholder={del ? 'Gate code, leave at door…' : 'Optional'} style={{ ...pxField, height:'auto', padding:10, resize:'none' }}></textarea></label>
          </div>
          <div style={{ padding:16, borderTop:'1px solid var(--border-hairline)' }}>
            <PXButton block size="lg" disabled={!ok} onClick={() => onSave(c)}>Save customer</PXButton>
          </div>
        </div>
      );
    }

    function CustomerRow({ mode, customer, onEdit }) {
      if (mode === 'Dine here') return null;
      const has = customer && customer.name;
      return (
        <button onClick={onEdit} style={{ margin:'0 16px', width:'calc(100% - 32px)', boxSizing:'border-box', padding:'10px 12px', borderRadius:'var(--radius-md)', border: has ? 'none' : '1.5px dashed var(--status-checkedin)', background: has ? 'var(--surface-card)' : 'transparent', color:'var(--text-primary)', display:'flex', alignItems:'center', gap:10, textAlign:'left', cursor:'pointer' }}>
          <PXIcon name={has ? 'user-round' : 'user-round-plus'} size={18} />
          <span style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:1 }}>
            {has ? (
              <React.Fragment>
                <span style={{ fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)' }}>{customer.name} · {customer.phone}</span>
                <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{mode === 'Delivery' ? customer.platform + ' · ' + customer.address : (customer.notes || 'Pickup at counter')}</span>
              </React.Fragment>
            ) : <span style={{ fontSize:'var(--text-sm)', color:'var(--status-checkedin)' }}>Add customer details · required</span>}
          </span>
          <PXIcon name="pencil" size={14} />
        </button>
      );
    }

    /* ---------- Check timers ---------- */
    const PX_T0 = Date.now();
    const PX_META = {
      412:{ type:'Delivery', openedMin:23, customer:{ name:'Mia Torres', phone:'55 5555 0142', address:'Av. Álvaro Obregón 18, depto 3', platform:'Uber Eats', notes:'' }, prepaid:'Uber Eats' },
      410:{ type:'Pickup', openedMin:4, customer:{ name:'Daniel Ruiz', phone:'55 5555 0177', notes:'' } },
      407:{ type:'Delivery', openedMin:14, customer:{ name:'Grace Kim', phone:'55 5555 0108', address:'Calle Durango 402', platform:'Own driver', notes:'Tocar dos veces' } },
      401:{ type:'Pickup', openedMin:52, closedAfter:18, customer:{ name:'Omar Haddad', phone:'55 5555 0190', notes:'' } },
      400:{ type:'Pickup', openedMin:9, customer:{ name:'Lena Park', phone:'55 5555 0123', notes:'' } },
      396:{ type:'Pickup', openedMin:31, customer:{ name:'Sam Ortiz', phone:'55 5555 0166', notes:'' } },
      391:{ type:'Delivery', openedMin:75, closedAfter:12, customer:{ name:'Ivy Chen', phone:'55 5555 0111', address:'Calle Orizaba 9', platform:'Rappi', notes:'' }, prepaid:'Rappi' },
      390:{ type:'Delivery', openedMin:2, customer:{ name:'Noah Brooks', phone:'55 5555 0155', address:'Av. Insurgentes 77', platform:'DiDi Food', notes:'' }, prepaid:'DiDi Food' },
    };
    const pxOpenedAt = (order) => PX_T0 - ((PX_META[order] || {}).openedMin || 0) * 60000;
    function useNow(ms = 1000) {
      const [now, setNow] = React.useState(Date.now());
      React.useEffect(() => { const t = setInterval(() => setNow(Date.now()), ms); return () => clearInterval(t); }, [ms]);
      return now;
    }
    const pxFmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; const p = (n) => String(n).padStart(2, '0'); return h ? h + ':' + p(m) + ':' + p(x) : p(m) + ':' + p(x); };
    const PX_WARN_MIN = 10, PX_LATE_MIN = 20;

    function ElapsedPill({ order, status, size = 'md' }) {
      const now = useNow();
      const meta = PX_META[order] || {};
      if (status === 'closed') {
        return <span style={{ display:'inline-flex', alignItems:'center', gap:4, fontSize:'var(--text-xs)', color:'var(--text-muted)' }}><PXIcon name="timer-off" size={12} />Closed in {meta.closedAfter || 0}m</span>;
      }
      const ms = now - pxOpenedAt(order);
      const min = ms / 60000;
      const tone = min >= PX_LATE_MIN ? 'late' : min >= PX_WARN_MIN ? 'warn' : 'ok';
      const bg = { ok:'var(--surface-raised)', warn:'var(--order-warn)', late:'var(--order-late)' }[tone];
      const fg = tone === 'ok' ? 'var(--text-primary)' : 'var(--text-on-light)';
      return (
        <span title={(status === 'pending' ? 'Pending close' : 'Open') + ' for ' + pxFmt(ms)} style={{ display:'inline-flex', alignItems:'center', gap:5, height: size === 'sm' ? 22 : 26, padding:'0 8px', borderRadius:'var(--radius-pill)', background:bg, color:fg, fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)', fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap' }}>
          <PXIcon name={tone === 'late' ? 'triangle-alert' : 'timer'} size={12} />{pxFmt(ms)}
        </span>
      );
    }

    const PX_TYPE_ICON = { 'Dine here':'utensils', Pickup:'shopping-bag', Delivery:'bike' };
    function OrderTypeTag({ order }) {
      const m = PX_META[order];
      if (!m) return null;
      return (
        <span style={{ display:'flex', alignItems:'center', gap:6, fontSize:'var(--text-xs)', color:'var(--text-secondary)', minWidth:0 }}>
          <PXIcon name={PX_TYPE_ICON[m.type]} size={14} />
          <span style={{ overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{m.type === 'Delivery' ? m.customer.platform : m.type} · {m.customer.name}</span>
          {m.prepaid && <PrepaidTag />}
        </span>
      );
    }

    function PrepaidTag({ via }) {
      return <span style={{ flex:'0 0 auto', marginLeft:'auto', display:'inline-flex', alignItems:'center', gap:4, height:20, padding:'0 7px', borderRadius:'var(--radius-pill)', background:'var(--mint-200)', color:'var(--text-on-light)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)' }}><PXIcon name="badge-check" size={12} />{via ? 'Paid via ' + via : 'Prepaid'}</span>;
    }

    /* ---------- 86 / sold out ---------- */
    const PX_86_KEY = 'compos-86';
    function useSoldOut() {
      const [list, setList] = React.useState(() => { try { return JSON.parse(localStorage.getItem(PX_86_KEY)) || ['Ramen tonkotsu', 'Salmón glaseado']; } catch (e) { return ['Ramen tonkotsu', 'Salmón glaseado']; } });
      const toggle = (name) => setList((l) => { const n = l.includes(name) ? l.filter((x) => x !== name) : [...l, name]; try { localStorage.setItem(PX_86_KEY, JSON.stringify(n)); } catch (e) {} return n; });
      return { list, isOut:(n) => list.includes(n), toggle };
    }
    function StockCard({ out, manage, onToggle, children }) {
      return (
        <div style={{ position:'relative', minWidth:0, display:'flex', flexDirection:'column' }}>
          <div style={{ opacity: out ? .35 : 1, pointerEvents: out || manage ? 'none' : 'auto', display:'flex', flexDirection:'column', flex:1 }}>{children}</div>
          {out && !manage && <span style={{ position:'absolute', top:8, right:8, display:'inline-flex', alignItems:'center', gap:4, height:22, padding:'0 8px', borderRadius:'var(--radius-pill)', background:'var(--status-danger)', color:'var(--text-on-light)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-bold)' }}><PXIcon name="ban" size={12} />86 · Sold out</span>}
          {manage && (

<script type="text/babel" data-src="../pos-tablet/Feedback.jsx">

        send: { tone:'neutral', icon:'chef-hat', title:'Send 3 items to kitchen?', message:'Order #412 moves to Pending Close. You can still add items.', confirmLabel:'Send to kitchen', then:() => window.toast({ tone:'positive', title:'Sent to kitchen', message:'Order #412 · 3 items', actionLabel:'Undo' }) },
        close: { tone:'positive', title:'Close shift?', message:'Counted $6447.00 · variance +$10.00. An end-of-day report will print.', confirmLabel:'Close shift', then:() => window.toast({ tone:'positive', title:'Shift closed' }) },

      const d = dlg && D[dlg];
      return (
        <div style={{ flex:1, minHeight:0, position:'relative', display:'flex', flexDirection:'column', overflow:'hidden' }}>
          <div style={{ flex:1, overflowY:'auto', padding: compact ? 12 : 20, display:'flex', flexDirection:'column', gap:20 }}>

            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <span style={label}>Toasts · tap to trigger</span>

                {T.map(([tone, title, message, actionLabel]) => <Button key={tone} variant="outline" size="sm" onClick={() => window.toast({ tone, title, message, actionLabel })}>{tone}</Button>)}
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <span style={label}>Confirmation dialogs</span>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                <Button variant="outline" size="sm" onClick={() => setDlg('send')}>Send to kitchen</Button>
                <Button variant="outline" size="sm" onClick={() => setDlg('close')}>Close shift</Button>
                <Button variant="outline" size="sm" onClick={() => setDlg('leave')}>Unsaved changes</Button>
                <Button variant="outline" size="sm" onClick={() => setDlg('delete')} style={{ color:'var(--danger-ink)', borderColor:'var(--danger-ink)' }}>Delete check</Button>
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
              <span style={label}>Manager override · demo PIN 1234</span>
              <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                <Button variant="outline" size="sm" onClick={() => request('Refund $179.00', 'Order #401 · Wrong item', (m) => window.toast({ tone:'positive', title:'Refund approved', message:'by ' + m }))}>Refund</Button>
                <Button variant="outline" size="sm" onClick={() => request('Discount 15%', 'Order #410 · Loyal customer', (m) => window.toast({ tone:'positive', title:'Discount applied', message:'by ' + m }))}>Discount</Button>

</script>

    const { NumericKeypad: PYKeypad, TotalsPanel: PYTotals, Button: PYButton, Icon: PYIcon, Badge: PYBadge, IconButton: PYIconButton } = window.ComposDesignSystem_9739cd;

    const PY_METHODS = [
      { key:'Cash', icon:'banknote', hint:'Change calculated' },
      { key:'Credit', icon:'credit-card', hint:'Tap, insert or swipe' },
      { key:'Debit', icon:'wallet-cards', hint:'PIN on terminal' },
    ];
    const pyMoney = (n) => '$' + n.toFixed(2);
    const PY_BILLS = [1000, 500, 200, 100, 50];
    const pyChip = (n) => Number.isInteger(n) ? '$' + n : pyMoney(n);
    const pyLabel = { fontSize:'var(--text-xs)', color:'var(--text-muted)', letterSpacing:'var(--tracking-wide)', textTransform:'uppercase' };
    const pyLoad = () => {
      try { const d = JSON.parse(localStorage.getItem('compos-checkout')); if (d && d.cart && Object.keys(d.cart).length) return d; } catch (e) {}
      const o = window.ORDERS[0];
      return { order:o.order, cart:Object.fromEntries(o.items.map((it) => [it.name, { qty:it.qty, price:it.price }])) };
    };

    function usePayment(back) {
      const [check] = React.useState(pyLoad);
      const [method, setMethod] = React.useState('Cash');
      const [entry, setEntry] = React.useState('');
      const [payments, setPayments] = React.useState([]);
      const lines = Object.entries(check.cart);
      const subtotal = lines.reduce((s, [, v]) => s + v.qty * window.mlPrice(v.price), 0);

        if (k === 'del') return e.slice(0, -1);
        if (k === '.' && e.includes('.')) return e;

    const { Icon: SPIcon, Button: SPButton, IconButton: SPIconButton } = window.ComposDesignSystem_9739cd;

    const spLoad = () => {

<script type="text/babel" data-src="../pos-tablet/SearchLayout.jsx">

    const SR_FILTERS = ['All', 'Menu', 'Checks', 'Customers'];
    const srHas = (s, q) => String(s || '').toLowerCase().includes(q);
    const srMark = (text, q) => {
      const t = String(text), i = t.toLowerCase().indexOf(q);
      if (!q || i < 0) return t;
      return <React.Fragment>{t.slice(0, i)}<mark style={{ background:'var(--surface-accent)', color:'var(--text-on-light)', borderRadius:3, padding:'0 1px' }}>{t.slice(i, i + q.length)}</mark>{t.slice(i + q.length)}</React.Fragment>;
    };

    function useSearch(initial = 'la') {
      const [q, setQ] = React.useState(initial);
      const [filter, setFilter] = React.useState('All');
      const stock = window.useSoldOut();

      const menu = !n ? [] : window.ML_CATS.flatMap((c) => c.items.map(([name, price]) => ({ name, price, cat:c.name, color:c.color }))).filter((i) => srHas(i.name, n) || srHas(i.cat, n));

<script type="text/babel" data-src="../pos-tablet/ShiftLayout.jsx">
    const { Icon: SHIcon, Button: SHButton, QuantityStepper: SHStepper, Badge: SHBadge } = window.ComposDesignSystem_9739cd;

    const SH_DENOMS = [1000, 500, 200, 100, 50, 20, 10, 5, 1];
    const shMoney = (n) => (n < 0 ? '-$' : '$') + Math.abs(n).toFixed(2);
    const shLabel = { fontSize:'var(--text-xs)', color:'var(--text-muted)', letterSpacing:'var(--tracking-wide)', textTransform:'uppercase' };
    const SH_SALES = [
      { label:'Cash', icon:'banknote', value:5775 },
      { label:'Credit', icon:'credit-card', value:9635 },
      { label:'Debit', icon:'wallet-cards', value:3240 },
      { label:'Uber Eats', icon:'bike', value:2580, platform:true },
      { label:'Rappi', icon:'bike', value:1346, platform:true },
      { label:'DiDi Food', icon:'bike', value:812, platform:true },
    ];

    function useShift() {
      const [phase, setPhase] = React.useState('open');
      const [start, setStart] = React.useState(2000);
      const [drops, setDrops] = React.useState([{ at:'11:30', amount:1000 }]);
      const [count, setCount] = React.useState({});
      const counted = SH_DENOMS.reduce((s, d) => s + d * (count[d] || 0), 0);
      const cashSales = SH_SALES[0].value, cashRefunds = 338;
      const expected = start + cashSales - cashRefunds - drops.reduce((s, d) => s + d.amount, 0);
      const variance = Math.round((counted - expected) * 100) / 100;
      const gross = SH_SALES.reduce((s, x) => s + x.value, 0);
      const begin = () => { setStart(counted); setCount({}); setDrops([]); setPhase('open'); };
      const drop = (amount) => setDrops((d) => [...d, { at:new Date().toTimeString().slice(0, 5), amount }]);
      return { phase, setPhase, start, drops, drop, count, setCount, counted, expected, variance, gross, cashRefunds, begin };
    }

    function SHCounter({ sh, compact }) {
      return (
        <div style={{ display:'flex', flexDirection:'column', gap: compact ? 4 : 6 }}>
          {SH_DENOMS.map((d) => (
            <div key={d} style={{ display:'flex', alignItems:'center', gap:10, padding: compact ? '6px 10px' : '8px 12px', borderRadius:'var(--radius-sm)', background:'var(--surface-card)' }}>
              <span style={{ width:56, fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>{'$' + d}</span>
              <SHStepper value={sh.count[d] || 0} onChange={(v) => sh.setCount((c) => ({ ...c, [d]:Math.max(0, v) }))} />
              <span style={{ marginLeft:'auto', fontSize:'var(--text-sm)', color:'var(--text-secondary)', fontVariantNumeric:'tabular-nums' }}>{shMoney(d * (sh.count[d] || 0))}</span>
            </div>
          ))}
        </div>
      );
    }

    function SHSummary({ sh, compact }) {
      const card = { background:'var(--surface-card)', borderRadius:'var(--radius-md)', padding:14, display:'flex', flexDirection:'column', gap:4, minWidth:0 };
      const stat = (label, value, sub, tone) => (
        <div style={card}>
          <span style={shLabel}>{label}</span>
          <span style={{ fontSize: compact ? 'var(--text-h2)' : 'var(--text-h1)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', fontWeight:'var(--weight-semibold)', letterSpacing:'var(--tracking-tight)', color: tone || 'var(--text-primary)' }}>{value}</span>
          {sub && <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{sub}</span>}
        </div>
      );
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <div style={{ display:'grid', gridTemplateColumns: compact ? 'repeat(2,minmax(0,1fr))' : 'repeat(auto-fit,minmax(180px,1fr))', gap:8 }}>
            {stat('Gross sales', shMoney(sh.gross), '64 orders · avg ' + shMoney(sh.gross / 64))}
            {stat('Refunds & voids', shMoney(-sh.cashRefunds), '2 refunds · 1 void', 'var(--order-void)')}
            {stat('Expected cash', shMoney(sh.expected), 'Start ' + shMoney(sh.start) + ' + cash − drops')}
          </div>
          <div style={{ ...card, gap:8 }}>
            <span style={shLabel}>Sales by tender</span>
            {SH_SALES.map((x) => (
              <div key={x.label} style={{ display:'flex', alignItems:'center', gap:10, fontSize:'var(--text-sm)' }}>
                <SHIcon name={x.icon} size={16} />
                <span style={{ flex:1 }}>{x.label}</span>
                {x.platform && <SHBadge tone="positive">Prepaid</SHBadge>}
                <span style={{ width:90, textAlign:'right', fontVariantNumeric:'tabular-nums', fontWeight:'var(--weight-semibold)' }}>{shMoney(x.value)}</span>
              </div>
            ))}
          </div>
          <div style={{ ...card, gap:8 }}>
            <span style={shLabel}>Cash drops</span>
            {sh.drops.length === 0 && <span style={{ fontSize:'var(--text-sm)', color:'var(--text-muted)' }}>None yet</span>}
            {sh.drops.map((d, i) => <div key={i} style={{ display:'flex', fontSize:'var(--text-sm)' }}><span style={{ flex:1, color:'var(--text-secondary)' }}>{d.at}</span><span style={{ fontWeight:'var(--weight-semibold)' }}>{shMoney(d.amount)}</span></div>)}
          </div>
        </div>
      );
    }

    function SHActions({ sh, compact }) {
      if (sh.phase === 'closed') {
        return (
          <div style={{ display:'flex', flexDirection:'column', gap:12, flex:1, minHeight:0 }}>
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>Open shift</span>
            <span style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>Count the starting cash in the drawer.</span>
            <div style={{ flex:1, minHeight:0, overflowY:'auto' }}><SHCounter sh={sh} compact={compact} /></div>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}><span style={{ fontSize:'var(--text-body)' }}>Starting cash</span><span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)' }}>{shMoney(sh.counted)}</span></div>
            <SHButton size="lg" block disabled={sh.counted <= 0} onClick={sh.begin}>Open shift</SHButton>
          </div>
        );
      }
      if (sh.phase === 'closing') {
        const ok = Math.abs(sh.variance) <= 1;
        return (
          <div style={{ display:'flex', flexDirection:'column', gap:12, flex:1, minHeight:0 }}>
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>Close shift · count drawer</span>
            <div style={{ flex:1, minHeight:0, overflowY:'auto' }}><SHCounter sh={sh} compact={compact} /></div>
            <div style={{ display:'flex', flexDirection:'column', gap:4, padding:12, borderRadius:'var(--radius-md)', background:'var(--surface-card)' }}>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:'var(--text-sm)' }}><span style={{ color:'var(--text-secondary)' }}>Expected</span><span>{shMoney(sh.expected)}</span></div>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:'var(--text-sm)' }}><span style={{ color:'var(--text-secondary)' }}>Counted</span><span>{shMoney(sh.counted)}</span></div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline' }}><span style={{ fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>Variance</span><span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)', color: ok ? 'var(--order-ready)' : 'var(--order-warn)' }}>{shMoney(sh.variance)}</span></div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <SHButton variant="outline" size="lg" onClick={() => sh.setPhase('open')} style={{ flex:'0 0 auto' }}>Back</SHButton>
              <SHButton size="lg" disabled={sh.counted <= 0} onClick={() => sh.setPhase('report')} style={{ flex:1, minWidth:0 }}>Close shift</SHButton>
            </div>
          </div>
        );
      }
      if (sh.phase === 'report') {
        return (
          <div style={{ display:'flex', flexDirection:'column', gap:12, alignItems:'center', textAlign:'center', margin:'auto 0' }}>
            <span style={{ width:56, height:56, borderRadius:28, background:'var(--order-ready)', color:'var(--text-on-light)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}><SHIcon name="check" size={28} /></span>
            <span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)' }}>Shift closed</span>
            <span style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>Counted {shMoney(sh.counted)} · variance {shMoney(sh.variance)}</span>
            <SHButton variant="outline" block icon={<SHIcon name="printer" size={16} />}>Print end-of-day report</SHButton>
            <SHButton block onClick={() => { sh.setCount({}); sh.setPhase('closed'); }}>Open new shift</SHButton>
          </div>
        );
      }
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          <span style={shLabel}>Cash drop</span>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,minmax(0,1fr))', gap:8 }}>
            {[500, 1000, 2000].map((a) => <button key={a} onClick={() => sh.drop(a)} style={{ height:48, borderRadius:'var(--radius-pill)', border:'1.5px solid var(--positive-ink)', background:'transparent', color:'var(--positive-ink)', fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)', cursor:'pointer' }}>${a}</button>)}
          </div>
          <SHButton variant="outline" size="lg" block icon={<SHIcon name="printer" size={16} />}>Print X report</SHButton>
          <SHButton size="lg" block onClick={() => { sh.setCount({}); sh.setPhase('closing'); }}>Close shift</SHButton>
        </div>
      );
    }

    function ShiftHeader({ sh, compact }) {
      const live = sh.phase === 'open' || sh.phase === 'closing';
      return (
        <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
          <span style={{ fontSize: compact ? 'var(--text-h2)' : 'var(--text-h1)', fontWeight:'var(--weight-semibold)' }}>Shift</span>
          <span style={{ display:'inline-flex', alignItems:'center', gap:6, height:26, padding:'0 10px', borderRadius:'var(--radius-pill)', background: live ? 'var(--order-ready)' : 'var(--order-closed)', color:'var(--text-on-light)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)' }}><SHIcon name={live ? 'clock' : 'lock'} size={12} />{live ? 'Open since 07:00' : 'Closed'}</span>
          {!compact && <span style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>Lena P. · Register 1</span>}
        </div>
      );
    }

    function ShiftBoard({ compact }) {
      const sh = useShift();
      const focus = sh.phase !== 'open';
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:12, padding:12, boxSizing:'border-box' }}>
          <ShiftHeader sh={sh} compact />
          {focus ? <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column' }}><SHActions sh={sh} compact /></div> : (
            <React.Fragment>
              <div style={{ flex:1, minHeight:0, overflowY:'auto' }}><SHSummary sh={sh} compact /></div>
              <SHActions sh={sh} compact />
            </React.Fragment>
          )}
        </div>
      );
    }

    function ShiftLayout() {
      const sh = useShift();
      const [railOpen, setRailOpen] = React.useState(false);
      const panel = { background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden', display:'flex', flexDirection:'column' };
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column' }}>
          <window.MLTopBar active="" onMenu={() => setRailOpen((o) => !o)} />
          <div style={{ flex:1, minHeight:0, display:'flex', gap:12, padding:'0 12px 12px' }}>
            <window.MLRail open={railOpen} active="Shift" />
            <main style={{ ...panel, flex:1, minWidth:0, padding:20, gap:16 }}>
              <ShiftHeader sh={sh} />
              <div style={{ flex:1, minHeight:0, overflowY:'auto', opacity: sh.phase === 'closed' ? .4 : 1 }}><SHSummary sh={sh} /></div>
            </main>
            <aside style={{ ...panel, width:360, flex:'0 0 auto', padding:20 }}><SHActions sh={sh} /></aside>
          </div>
        </div>
      );
    }
    Object.assign(window, { ShiftLayout, ShiftBoard });

</script>
<script type="text/babel" data-src="../pos-tablet/IncomingLayout.jsx">
    const INds = () => window.ComposDesignSystem_9739cd;
    const IN_SOURCES = ['All', 'Uber Eats', 'Rappi', 'DiDi Food', 'Website', 'Walk-in'];
    const IN_REJECT = ['Too busy', 'Item sold out', 'Closing soon', 'Outside delivery area', 'Suspected fraud', 'Other'];
    const IN_PREP = [10, 15, 20, 30];
    const IN_SEED = [
      { order:'UE-2231', source:'Uber Eats', type:'Delivery', customer:'Mia T.', prepaid:'Uber Eats', left:95, address:'Av. Álvaro Obregón 18, depto 3', notes:'Sin popotes', items:[{ qty:2, name:'Bowl teriyaki', mods:['Mediano','Fideos','Salmón'], price:159 }, { qty:1, name:'Mochi de matcha', price:69 }] },
      { order:'RP-0912', source:'Rappi', type:'Delivery', customer:'Carlos V.', prepaid:'Rappi', left:24, address:'Calle Durango 402', items:[{ qty:1, name:'Yakisoba', mods:['Grande','Udon'], price:149 }, { qty:2, name:'Bao de pollo', price:85 }, { qty:1, name:'Brownie de matcha', price:65 }, { qty:1, name:'Jugo de naranja', price:49 }] },
      { order:'W-118', source:'Website', type:'Pickup', customer:'Carla N.', left:150, notes:'Recoge a las 12:40', items:[{ qty:1, name:'Bowl spicy tuna', mods:['Chico','Pollo'], price:179 }, { qty:1, name:'Ensalada wakame', price:79 }] },
      { order:'DD-5530', source:'DiDi Food', type:'Delivery', customer:'Noah B.', prepaid:'DiDi Food', left:132, address:'Av. Insurgentes 77', items:[{ qty:3, name:'Bowl katsu', mods:['Mediano','Arroz','Pollo'], price:169 }] },
    ];
    const IN_ARRIVALS = [
      { source:'Uber Eats', type:'Delivery', customer:'Ava R.', prepaid:'Uber Eats', address:'Calle Tonalá 5', items:[{ qty:1, name:'Ramen tonkotsu', mods:['Mediano','Arroz','Camarón'], price:189 }, { qty:1, name:'Cheesecake japonés', price:89 }] },
      { source:'Walk-in', type:'Pickup', customer:'Mostrador', items:[{ qty:2, name:'Ramen miso', mods:['Chico','Arroz'], price:175 }] },
      { source:'Rappi', type:'Delivery', customer:'Iris M.', prepaid:'Rappi', address:'Calle Colima 31', items:[{ qty:1, name:'Rollitos primavera', price:85 }, { qty:1, name:'Bowl teriyaki', mods:['Grande','Arroz','Res'], price:159 }] },
    ];
    const IN_PREFIX = { 'Uber Eats':'UE', Rappi:'RP', 'DiDi Food':'DD', Website:'W', 'Walk-in':'C' };
    const inTotal = (o) => o.items.reduce((s, it) => s + it.qty * it.price, 0);
    const inMoney = (n) => '$' + n.toFixed(2);

    function useIncoming() {
      const [orders, setOrders] = React.useState(IN_SEED);
      const [sel, setSel] = React.useState(IN_SEED[0].order);
      const [src, setSrc] = React.useState('All');
      const [prep, setPrep] = React.useState({});
      const [rejecting, setRejecting] = React.useState(null);
      const [sound, setSound] = React.useState(true);
      const [accepted, setAccepted] = React.useState(0);
      const n = React.useRef(0);
      React.useEffect(() => {
        const t = setInterval(() => setOrders((os) => os.map((o) => ({ ...o, left: Math.max(0, o.left - 1) }))), 1000);
        const a = setInterval(() => {
          const base = IN_ARRIVALS[n.current % IN_ARRIVALS.length]; n.current += 1;
          const o = { ...base, order: IN_PREFIX[base.source] + '-' + (3000 + Math.floor(Math.random() * 900)), left: 180 };
          setOrders((os) => [...os, o]);
          window.toast({ tone:'incoming', title:'New ' + o.source + ' order', message:'#' + o.order + ' · ' + inMoney(inTotal(o)), actionLabel:'View', onAction:() => setSel(o.order) });

      const accept = (id) => { const o = orders.find((x) => x.order === id); remove(id); setAccepted((x) => x + 1); window.toast({ tone:'positive', title:'Accepted · sent to kitchen', message:'#' + id + ' · ready in ' + (prep[id] || 15) + ' min', actionLabel:'Undo', onAction:() => { setOrders((os) => [...os, o]); setSel(id); } }); };

    }

    function STSaveBar({ st, compact }) {
      const { Button } = STds();
      if (!st.dirty) return null;
      return (
        <div style={{ flex:'0 0 auto', display:'flex', alignItems:'center', gap:10, padding: compact ? 12 : '12px 20px', borderTop:'1px solid var(--border-hairline)', background:'var(--surface-card)' }}>

          <STSaveBar st={st} compact />
          {st.ov}
          <window.ToastHost bottom={12} />
        </div>

    function SettingsLayout() {
      const st = useSettings();
      const [sec, setSec] = React.useState('general');
      const [railOpen, setRailOpen] = React.useState(false);
      const panel = { background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden', display:'flex', flexDirection:'column' };
      return (

            <window.MLRail open={railOpen} active="Settings" />
            <aside style={{ ...panel, width:260, flex:'0 0 auto', padding:12, gap:12 }}>
              <span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)', padding:'8px 8px 0' }}>Settings</span>

              <div style={{ flex:1, minHeight:0, overflowY:'auto', padding:'8px 24px 24px', display:'flex', flexDirection:'column', gap:24 }}><STSection id={sec} s={st.s} set={st.set} /></div>

    Object.assign(window, { SettingsLayout, SettingsBoard });

</script>
<script type="text/babel" data-src="../pos-tablet/ReportsLayout.jsx">

        <div style={{ display:'grid', gridTemplateColumns: compact ? 'repeat(2,minmax(0,1fr))' : 'repeat(4,minmax(0,1fr))', gap: compact ? 8 : 12 }}>

    function RPChannelMix({ r }) {
      return (
        <RPCard>
          <span style={RPlabel}>Sales by channel</span>
          <div style={{ display:'flex', height:16, borderRadius:8, overflow:'hidden', gap:2 }}>

              <span key={n} style={{ display:'flex', alignItems:'center', gap:6, fontSize:'var(--text-sm)' }}>

              </span>

          </div>

    }

    function RPDelivery({ r, compact }) {
      const { PrepaidTag } = RPds();
      const max = Math.max(...r.platforms.map((p) => p.gross));
      return (
        <RPCard>
          <div style={{ display:'flex', alignItems:'baseline', gap:10, flexWrap:'wrap' }}>
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>Delivery breakdown</span>
            <span style={{ fontSize:'var(--text-sm)', color:'var(--text-secondary)' }}>{rpMoney(r.deliveryGross)} gross · {rpMoney(r.fees)} in platform fees</span>
          </div>
          {!compact && (
            <div style={{ display:'grid', gridTemplateColumns:'minmax(0,1.4fr) repeat(6,minmax(0,1fr))', gap:8, ...RPlabel }}>
              <span>Platform</span><span style={{ textAlign:'right' }}>Orders</span><span style={{ textAlign:'right' }}>Gross</span><span style={{ textAlign:'right' }}>Fee</span><span style={{ textAlign:'right' }}>Net payout</span><span style={{ textAlign:'right' }}>Avg ticket</span><span style={{ textAlign:'right' }}>Avg prep</span>
            </div>
          )}
          {r.platforms.map((p) => compact ? (
            <div key={p.name} style={{ display:'flex', flexDirection:'column', gap:6, paddingTop:10, borderTop:'1px solid var(--border-hairline)' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}><span style={{ width:10, height:10, borderRadius:5, background:RP_COLORS[p.name] }}></span><span style={{ flex:1, fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>{p.name}</span><span style={{ fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)' }}>{rpMoney(p.net)}</span></div>
              <span style={{ height:6, borderRadius:3, background:'var(--surface-raised)', overflow:'hidden' }}><span style={{ display:'block', height:'100%', width:(p.gross / max * 100) + '%', background:RP_COLORS[p.name] }}></span></span>
              <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{p.orders} orders · {rpMoney(p.gross)} gross · −{rpMoney(p.fee)} ({p.pct}%) · prep {p.prep}m</span>
            </div>
          ) : (
            <div key={p.name} style={{ display:'grid', gridTemplateColumns:'minmax(0,1.4fr) repeat(6,minmax(0,1fr))', gap:8, alignItems:'center', fontSize:'var(--text-sm)', fontVariantNumeric:'tabular-nums', paddingTop:10, borderTop:'1px solid var(--border-hairline)' }}>
              <span style={{ display:'flex', flexDirection:'column', gap:6, minWidth:0 }}>
                <span style={{ display:'flex', alignItems:'center', gap:8, fontWeight:'var(--weight-semibold)' }}><span style={{ width:10, height:10, borderRadius:5, background:RP_COLORS[p.name] }}></span>{p.name}</span>
                <span style={{ height:6, borderRadius:3, background:'var(--surface-raised)', overflow:'hidden' }}><span style={{ display:'block', height:'100%', width:(p.gross / max * 100) + '%', background:RP_COLORS[p.name] }}></span></span>
              </span>
              <span style={{ textAlign:'right' }}>{p.orders}</span>
              <span style={{ textAlign:'right' }}>{rpMoney(p.gross)}</span>
              <span style={{ textAlign:'right', color:'var(--danger-ink)' }}>−{rpMoney(p.fee)}<span style={{ display:'block', fontSize:'var(--text-xs)', color:'var(--text-muted)' }}>{p.pct}%</span></span>
              <span style={{ textAlign:'right', fontWeight:'var(--weight-semibold)' }}>{rpMoney(p.net)}</span>
              <span style={{ textAlign:'right' }}>{rpMoney(p.avg)}</span>
              <span style={{ textAlign:'right', color: p.prep > 17 ? 'var(--danger-ink)' : 'var(--text-primary)' }}>{p.prep}m</span>
            </div>
          ))}
          <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)', display:'flex', alignItems:'center', gap:8 }}><PrepaidTag /> Platform orders are paid out by the platform; they don't count toward cash in drawer.</span>
        </RPCard>
      );
    }

    function RPSales({ r, compact }) {
      const { BarChart } = RPds();
      return (
        <RPCard>
          <span style={RPlabel}>{r.range === 'Today' ? 'Sales by hour' : r.range === 'Week' ? 'Sales by day' : 'Sales by week'}</span>
          <BarChart height={compact ? 140 : 180} data={r.d.hours.map(([label, value]) => ({ label, value }))} />
        </RPCard>
      );
    }

    function RPTop() {
      return (
        <RPCard>
          <span style={RPlabel}>Top items</span>
          {RP_TOP.map(([n, q, c], i) => (
            <div key={n} style={{ display:'flex', alignItems:'center', gap:10, fontSize:'var(--text-sm)' }}>
              <span style={{ width:20, color:'var(--text-muted)' }}>{i + 1}</span>
              <span style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}><span style={{ fontWeight:'var(--weight-semibold)' }}>{n}</span><span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{c}</span></span>
              <span style={{ fontVariantNumeric:'tabular-nums' }}>{q} sold</span>
            </div>
          ))}
        </RPCard>
      );
    }

    function RPHeader({ r, compact }) {
      const { Button, Icon } = RPds();
      return (
        <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
          <span style={{ fontSize: compact ? 'var(--text-h2)' : 'var(--text-h1)', fontWeight:'var(--weight-semibold)', marginRight:'auto' }}>Reports</span>
          <div style={{ display:'flex', gap:4, padding:4, borderRadius:'var(--radius-pill)', background:'var(--surface-card)' }}>
            {Object.keys(RP_DATA).map((k) => <button key={k} onClick={() => r.setRange(k)} style={{ height:36, padding:'0 14px', borderRadius:'var(--radius-pill)', border:'none', background: k === r.range ? 'var(--surface-inverse)' : 'transparent', color: k === r.range ? 'var(--text-on-inverse)' : 'var(--text-primary)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', cursor:'pointer' }}>{k}</button>)}
          </div>
          {!compact && <Button variant="outline" size="sm" icon={<Icon name="download" size={16} />} onClick={() => window.toast({ tone:'positive', title:'Report exported', message:r.range + ' · CSV sent to owner@compos.co' })}>Export</Button>}
        </div>
      );
    }

    function ReportsBoard({ compact }) {
      const r = useReports();
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}>
          <div style={{ flex:1, minHeight:0, overflowY:'auto', padding:12, display:'flex', flexDirection:'column', gap:10 }}>
            <RPHeader r={r} compact />
            <RPKpis r={r} compact />
            <RPDelivery r={r} compact />
            <RPChannelMix r={r} />
            <RPSales r={r} compact />
            <RPTop />
          </div>
          <window.ToastHost bottom={12} />
        </div>
      );
    }

    function ReportsLayout() {
      const r = useReports();
      const [railOpen, setRailOpen] = React.useState(false);
      return (
        <div style={{ height:'100%', display:'flex', flexDirection:'column', position:'relative' }}>

                <RPTop />

            </main>
          </div>
          <window.ToastHost />

    Object.assign(window, { ReportsLayout, ReportsBoard });

</script>
<script type="text/babel" data-src="PhoneLayouts.jsx">
    const { NumericKeypad: PLKeypad, DishCard: PLDish, IconButton: PLIconButton, Icon: PLIcon, Badge: PLBadge } = window.ComposDesignSystem_9739cd;

    function PLTop({ active, onMenu }) {
      const tab = (label, on, disabled) => (
        <button disabled={disabled} style={{ flex:1, height:40, borderRadius:'var(--radius-pill)', border: on ? 'none' : '1px solid var(--border-strong)', background: on ? 'var(--surface-inverse)' : 'transparent', color: on ? 'var(--text-on-inverse)' : disabled ? 'var(--text-muted)' : 'var(--text-primary)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)', letterSpacing:'var(--tracking-wide)', display:'flex', alignItems:'center', justifyContent:'center', gap:6, cursor: disabled ? 'not-allowed' : 'pointer' }}>
          {label}{disabled && <PLBadge tone="neutral">Soon</PLBadge>}
        </button>
      );
      return (
        <header style={{ flex:'0 0 auto', padding:'8px 12px 12px', boxShadow:'inset 0 3px 0 var(--brand-stripe)', display:'flex', flexDirection:'column', gap:10 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <PLIconButton icon="menu" label="Open navigation" variant="secondary" onClick={onMenu} />
            <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>Lena P.</span>
            <PLIconButton icon="search" label="Search" variant="outline" style={{ marginLeft:'auto' }} />
          </div>
          <div style={{ display:'flex', gap:6 }}>{tab('CHECKS', active === 'CHECKS')}{tab('MENU', active === 'MENU')}{tab('REFUND', false, true)}</div>
        </header>
      );
    }

    function PLOverlay({ open, onClose, side, children }) {
      if (!open) return null;
      return (
        <div style={{ position:'absolute', inset:0, zIndex:10, display:'flex', flexDirection:'column', justifyContent: side === 'left' ? 'stretch' : 'flex-end' }}>
          <div onClick={onClose} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,.55)' }}></div>
          <div style={{ position:'relative', padding:8, display:'flex', flexDirection:'column', height: side === 'left' ? '100%' : '88%', boxSizing:'border-box', alignItems: side === 'left' ? 'flex-start' : 'stretch' }}>{children}</div>
        </div>
      );
    }

    function PLCheckBar({ count, total, onOpen, label = 'View check' }) {
      return (
        <button onClick={onOpen} disabled={!count} style={{ margin:'0 12px 8px', height:56, borderRadius:'var(--radius-md)', border:'none', background: count ? 'var(--surface-inverse)' : 'var(--surface-card)', color: count ? 'var(--text-on-inverse)' : 'var(--text-muted)', display:'flex', alignItems:'center', gap:10, padding:'0 16px', fontSize:'var(--text-body)', fontWeight:'var(--weight-semibold)', cursor: count ? 'pointer' : 'default' }}>
          <PLIcon name="shopping-cart" size={20} />{count ? label : 'Check is empty'}
          {count > 0 && <PLBadge tone="accent">{count}</PLBadge>}
          <span style={{ marginLeft:'auto' }}>{'$' + total.toFixed(2)}</span>
        </button>
      );
    }

    const plTotals = (cart) => Object.values(cart).reduce((a, v) => ({ n:a.n + v.qty, t:a.t + v.qty * window.mlPrice(v.price) }), { n:0, t:0 });

    function PhoneMenu({ initialMod = null }) {
      const cats = window.ML_CATS;
      const [cat, setCat] = React.useState(cats[0].name);
      const [modItem, setModItem] = React.useState(initialMod);
      const [cart, setCart] = React.useState({ 'Pollo teriyaki':{ qty:1, price:'$165' } });
      const [drawer, setDrawer] = React.useState(false);
      const [sheet, setSheet] = React.useState(false);
      const [paying, setPaying] = React.useState(false);
      const [manage, setManage] = React.useState(false);
      const stock = window.useSoldOut();
      const active = cats.find((c) => c.name === cat);
      const setQty = (name, price, q) => setCart((c) => { const n = { ...c }; if (q <= 0) delete n[name]; else n[name] = { ...n[name], qty:q, price }; return n; });
      const { n, t } = plTotals(cart);
      const qtyOf = (name) => window.PX_MODS[name] ? Object.values(cart).filter((v) => v.name === name).reduce((a, v) => a + v.qty, 0) : (cart[name] ? cart[name].qty : 0);
      const onDish = (name, price, q) => {
        if (!window.PX_MODS[name]) return setQty(name, price, q);
        if (q > qtyOf(name)) return setModItem({ name, price });
        const k = Object.keys(cart).reverse().find((key) => cart[key].name === name);
        if (k) setQty(k, cart[k].price, cart[k].qty - 1);
      };
      if (paying) return <PhonePayment onBack={() => setPaying(false)} />;
      if (modItem) return <window.ModifierPanel key={modItem.name} compact item={modItem.name} basePrice={window.mlPrice(modItem.price)} onCancel={() => setModItem(null)} onAdd={(v) => { window.mlAddVariant(setCart, v); setModItem(null); }} />;
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}>
          <PLTop active="MENU" onMenu={() => setDrawer(true)} />
          <main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}>
            <div style={{ flex:1, overflowY:'auto', padding:12, display:'grid', gridTemplateColumns:'repeat(2,minmax(0,1fr))', gridAutoRows:'min-content', gap:8 }}>
              {active.items.map(([name, price]) => (
                <window.StockCard key={name} out={stock.isOut(name)} manage={manage} onToggle={() => stock.toggle(name)}><PLDish name={name} price={price} accent={active.color} route={window.PX_MODS[name] ? 'Has modifiers' : cat} qty={qtyOf(name)} onQty={(q) => onDish(name, price, q)} style={{ minWidth:0, flex:1 }} /></window.StockCard>
              ))}
            </div>
            <div style={{ flex:'0 0 auto', display:'flex', gap:8, overflowX:'auto', padding:12, borderTop:'1px solid var(--border-hairline)' }}>
              <window.StockToggle compact manage={manage} count={stock.list.length} onClick={() => setManage((v) => !v)} />
              {cats.map((c) => {
                const on = c.name === cat;
                return (
                  <button key={c.name} onClick={() => setCat(c.name)} style={{ flex:'0 0 auto', height:44, padding:'0 14px', borderRadius:'var(--radius-sm)', border:`1.5px solid ${window.inkOf(c.color)}`, background: on ? c.color : 'transparent', color: on ? 'var(--text-on-light)' : window.inkOf(c.color), fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', display:'flex', alignItems:'center', gap:8, cursor:'pointer' }}>
                    <PLIcon name={c.icon} size={18} />{c.name}
                  </button>
                );
              })}
            </div>
          </main>
          <PLCheckBar count={n} total={t} onOpen={() => setSheet(true)} />
          <PLOverlay open={drawer} onClose={() => setDrawer(false)} side="left"><window.MLRail open={true} onNav={() => setDrawer(false)} /></PLOverlay>
          <PLOverlay open={sheet} onClose={() => setSheet(false)}>
            <window.MLCart cart={cart} setQty={setQty} clear={() => { setCart({}); setSheet(false); }} onCheckout={() => { try { localStorage.setItem('compos-checkout', JSON.stringify({ order:'New', cart })); } catch (e) {} setSheet(false); setPaying(true); }} style={{ width:'100%', flex:1, minHeight:0 }} />
          </PLOverlay>
        </div>
      );
    }

    function PhoneOrders({ initialStatus = 'open', initialSel = null }) {
      const { OL_STATUS, OL_STATUS_OF, OL_ACTIONS, olToCart, OLCheckCard } = window;
      const [status, setStatus] = React.useState(initialStatus);
      const [carts, setCarts] = React.useState(() => Object.fromEntries(window.ORDERS.map((o) => [o.order, olToCart(o)])));
      const [sel, setSel] = React.useState(initialSel);
      const [drawer, setDrawer] = React.useState(false);
      const [paying, setPaying] = React.useState(false);
      const [splitting, setSplitting] = React.useState(null);
      const [voiding, setVoiding] = React.useState(null);
      const [voided, setVoided] = React.useState([]);
      const [ov, requestOverride] = window.useOverride();
      const list = window.ORDERS.filter((o) => OL_STATUS_OF[o.order] === status && !voided.includes(o.order));
      const selOrder = window.ORDERS.find((o) => o.order === sel);
      const st = OL_STATUS.find((s) => s.key === status);
      const setQty = (name, price, q) => setCarts((c) => { const n = { ...c[sel] }; if (q <= 0) delete n[name]; else n[name] = { ...n[name], qty:q, price }; return { ...c, [sel]:n }; });
      if (paying) return <PhonePayment onBack={() => setPaying(false)} />;
      if (splitting) return <window.SplitBoard compact src={{ order:splitting, cart:carts[splitting] }} onBack={() => setSplitting(null)} onConfirm={() => setSplitting(null)} />;
      const target = list[0] ? list[0].order : null;
      const lines = (o) => Object.entries(carts[o.order]).map(([name, v]) => ({ key:name, qty:v.qty, name:v.name || name, mods:v.mods, price:'$' + (v.qty * window.mlPrice(v.price)).toFixed(2) }));
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}>
          <PLTop active="CHECKS" onMenu={() => setDrawer(true)} />
          <main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}>
            <div style={{ padding:'14px 14px 0', display:'flex', alignItems:'baseline', gap:8 }}>
              <span style={{ fontSize:'var(--text-h2)', fontWeight:'var(--weight-semibold)' }}>Checks</span>
              <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{st.hint}</span>
            </div>
            <div style={{ flex:1, overflowY:'auto', padding:12, display:'flex', flexDirection:'column', gap:8 }}>
              {list.map((o) => <OLCheckCard key={o.order} order={o.order} status={status} lines={lines(o)} subtotal={'$' + plTotals(carts[o.order]).t.toFixed(2)} onClick={() => setSel(o.order)} />)}
            </div>
            <div style={{ flex:'0 0 auto', borderTop:'1px solid var(--border-hairline)', padding:12, display:'flex', flexDirection:'column', gap:10 }}>
              <div style={{ display:'flex', gap:6 }}>
                {OL_ACTIONS.map((a) => {
                  const ok = a.on.includes(status);
                  return (
                    <button key={a.label} disabled={!ok || !target} onClick={() => { if (a.label === 'Split') setSplitting(target); if (a.label === 'Cancel') setVoiding(target); }} title={a.label} style={{ height:40, padding:'0 12px', borderRadius:'var(--radius-pill)', border:`1px solid ${a.danger ? 'var(--status-danger)' : 'var(--border-strong)'}`, background:'transparent', color: a.danger ? 'var(--danger-ink)' : 'var(--text-primary)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-medium)', display:'flex', alignItems:'center', gap:6, marginLeft: a.danger ? 'auto' : 0, cursor: ok ? 'pointer' : 'not-allowed' }}>
                      <PLIcon name={a.icon} size={16} />{a.label}
                    </button>
                  );
                })}
              </div>
              <div style={{ display:'flex', gap:6 }}>
                {OL_STATUS.map((s) => {
                  const on = s.key === status;
                  const cnt = window.ORDERS.filter((o) => OL_STATUS_OF[o.order] === s.key).length;
                  return (
                    <button key={s.key} onClick={() => setStatus(s.key)} style={{ flex:1, minWidth:0, height:48, borderRadius:'var(--radius-sm)', border:'1.5px solid ' + window.inkOf(window.PX_STATUS[s.key].color), background: on ? window.PX_STATUS[s.key].color : 'transparent', color: on ? 'var(--text-on-light)' : window.inkOf(window.PX_STATUS[s.key].color), fontSize:'var(--text-xs)', fontWeight:'var(--weight-semibold)', display:'flex', alignItems:'center', justifyContent:'center', gap:6, cursor:'pointer', whiteSpace:'nowrap' }}>
                      {s.label}
                      <span style={{ minWidth:20, height:20, padding:'0 5px', boxSizing:'border-box', borderRadius:'var(--radius-pill)', background: on ? 'rgba(0,0,0,.16)' : 'var(--surface-card)', color: on ? 'var(--text-on-light)' : 'var(--text-primary)', fontSize:'var(--text-xs)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>{cnt}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </main>
          <PLOverlay open={drawer} onClose={() => setDrawer(false)} side="left"><window.MLRail open={true} onNav={() => setDrawer(false)} /></PLOverlay>
          {voiding && <window.VoidDialog order={voiding} onClose={() => setVoiding(null)} onConfirm={({ reason }) => { const id = voiding; setVoiding(null); requestOverride('Void / delete check #' + id, reason, (mgr) => { setVoided((v) => [...v, id]); window.toast({ tone:'danger', title:'Check #' + id + ' voided', message:'Approved by ' + mgr }); }); }} />}
          {ov}<window.ToastHost bottom={12} />
          <PLOverlay open={!!selOrder} onClose={() => setSel(null)}>
            {selOrder && <window.MLCart key={sel} cart={carts[sel]} setQty={setQty} clear={() => setSel(null)} onCheckout={() => { try { localStorage.setItem('compos-checkout', JSON.stringify({ order:sel, cart:carts[sel] })); } catch (e) {} setSel(null); setPaying(true); }} title={'Order #' + sel} initialMode={(window.PX_META[sel] || {}).type || 'Dine here'} initialCustomer={(window.PX_META[sel] || {}).customer || null}
              meta={<window.StatusChip status={status} solid />} style={{ width:'100%', flex:1, minHeight:0 }} />}
          </PLOverlay>
        </div>
      );
    }

    function PhonePayment({ onBack }) {
      const p = window.usePayment(onBack);
      const [items, setItems] = React.useState(false);
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', gap:8, padding:'4px 12px 8px', boxSizing:'border-box', position:'relative' }}>
          <window.ToastHost bottom={12} />
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <PLIconButton icon="arrow-left" label="Back to check" variant="secondary" onClick={p.cancel} />
            <span style={{ display:'flex', flexDirection:'column' }}>
              <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>Payment</span>
              <span style={{ fontSize:'var(--text-xs)', color:'var(--text-secondary)' }}>{p.title}</span>
            </span>
            {p.done && <PLBadge tone="positive">Closed</PLBadge>}
            <button onClick={() => setItems((v) => !v)} style={{ marginLeft:'auto', height:36, padding:'0 12px', borderRadius:'var(--radius-pill)', border:'1px solid var(--border-strong)', background:'transparent', color:'var(--text-primary)', fontSize:'var(--text-xs)', fontWeight:'var(--weight-medium)', display:'flex', alignItems:'center', gap:6, cursor:'pointer' }}>
              <PLIcon name={items ? 'chevron-up' : 'receipt-text'} size={14} />{items ? 'Hide' : 'Breakdown'}
            </button>
          </div>
          <div style={{ flex:1, minHeight:0, overflowY:'auto', display:'flex', flexDirection:'column', gap:8 }}>
            <div style={{ flex:'0 0 auto', display:'flex' }}><window.PYMethods p={p} row compact /></div>
            {items && <window.PYBreakdown p={p} />}
            <window.PYReceived p={p} size="var(--text-display-2)" />
          </div>
          <div style={{ background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', padding:12, display:'flex', flexDirection:'column', gap:10 }}>
            <window.PYQuick p={p} height={40} />
            <PLKeypad onKey={p.done ? undefined : p.onKey} keySize={52} gap={8} style={{ opacity: p.done ? .4 : 1 }} />
            <window.PYActions p={p} />
          </div>
        </div>
      );
    }

    function PhoneKitchen() {
      const [drawer, setDrawer] = React.useState(false);
      return (
        <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}>
          <PLTop active="" onMenu={() => setDrawer(true)} />
          <main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}>
            <window.KitchenBoard compact />
          </main>
          <PLOverlay open={drawer} onClose={() => setDrawer(false)} side="left"><window.MLRail open={true} active="Kitchen" onNav={() => setDrawer(false)} /></PLOverlay>
        </div>
      );
    }

    function PLThemePicker() {
      const [, force] = React.useReducer((x) => x + 1, 0);
      React.useEffect(() => { window.addEventListener('compos-theme', force); return () => window.removeEventListener('compos-theme', force); }, []);
      const cur = window.composTheme();
      return (
        <div style={{ display:'flex', gap:8, alignItems:'center', justifyContent:'center', width:'100%', color:'var(--light-text)', fontSize:'var(--text-sm)' }}>
          <span style={{ marginRight:4 }}>Theme</span>
          {window.COMPOS_THEMES.map((t) => <button key={t.id} onClick={() => window.composSetTheme(t.id)} style={{ height:36, padding:'0 14px', borderRadius:'var(--radius-pill)', border:'1px solid #11131533', background: t.id === cur ? 'var(--light-text)' : 'transparent', color: t.id === cur ? '#fff' : 'var(--light-text)', fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)', cursor:'pointer' }}>{t.label}</button>)}
        </div>
      );
    }
    function PhoneLayouts() {
      const cap = (t, s) => (
        <div style={{ display:'flex', flexDirection:'column', gap:2, color:'var(--light-text)' }}>
          <span style={{ fontSize:'var(--text-h3)', fontWeight:'var(--weight-semibold)' }}>{t}</span>
          <span style={{ fontSize:'var(--text-sm)', color:'var(--gray-500)' }}>{s}</span>
        </div>
      );
      return (
        <div style={{ display:'flex', flexWrap:'wrap', gap:48, padding:40, justifyContent:'center' }}>
          <PLThemePicker />
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Menu', 'Tap the check bar to open the cart')}<window.PhoneFrame><PhoneMenu /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Modifiers', 'Shown when a coffee item is tapped')}<window.PhoneFrame><PhoneMenu initialMod={{ name:'Bowl teriyaki', price:'$159' }} /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Orders', 'Timers turn amber at 10 min, red at 20')}<window.PhoneFrame><PhoneOrders /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Kitchen', 'New → Preparing → Ready')}<window.PhoneFrame><PhoneKitchen /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Split check', 'Select items, move or create checks')}<window.PhoneFrame><window.SplitBoard compact src={window.spLoad()} onBack={() => {}} onConfirm={() => {}} /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Refund', 'Check → items → reason → method')}<window.PhoneFrame><window.RefundBoard compact /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Search', 'Menu, checks and customers')}<window.PhoneFrame><window.SearchBoard compact onBack={() => {}} /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Shift', 'Summary, cash drops, close & count')}<window.PhoneFrame><window.ShiftBoard compact /></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Incoming', 'Accept / reject with countdown')}<window.PhoneFrame><div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}><PLTop active="" onMenu={() => {}} /><main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}><window.IncomingBoard compact /></main></div></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Reports', 'KPIs, delivery breakdown, channel mix')}<window.PhoneFrame><div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}><PLTop active="" onMenu={() => {}} /><main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}><window.ReportsBoard compact /></main></div></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Settings', 'Sections → detail, save bar')}<window.PhoneFrame><div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}><PLTop active="" onMenu={() => {}} /><main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}><window.SettingsBoard compact /></main></div></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Toasts & dialogs', 'Override PIN 1234')}<window.PhoneFrame><div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column', position:'relative' }}><PLTop active="" onMenu={() => {}} /><main style={{ flex:1, minHeight:0, margin:'0 12px 8px', display:'flex', flexDirection:'column', background:'var(--surface-panel)', borderRadius:'var(--radius-lg)', overflow:'hidden' }}><window.FeedbackShowcase compact /></main></div></window.PhoneFrame></div>
          <div style={{ display:'flex', flexDirection:'column', gap:16 }}>{cap('Payment', 'Shown on Checkout from either screen')}<window.PhoneFrame><PhonePayment onBack={() => {}} /></window.PhoneFrame></div>
        </div>
      );
    }
    Object.assign(window, { PhoneOrders, PhoneMenu, PhoneLayouts });
    if (!window.COMPOS_NO_AUTOMOUNT) ReactDOM.createRoot(document.getElementById('root')).render(<PhoneLayouts />);

</script>
<script>
    (function(){var n=decodeURIComponent(location.pathname.split('/').pop());try{parent!==window&&parent.postMessage({posScreen:n},'*')}catch(e){}window.addEventListener('message',function(e){if(e.data&&e.data.posTheme&&window.composSetTheme)window.composSetTheme(e.data.posTheme)});})();
</script>
</body>
</html>
