<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Compos — Mobile</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="../theme.js"></script>
    <style>
        html,body{margin:0}body{background:var(--light-canvas);font-family:var(--font-ui);color:var(--text-primary)}button{font-family:inherit}a{color:var(--text-link)}a:hover{color:var(--black-900)}::-webkit-scrollbar{width:0}
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
            integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
            integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
            crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
            integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
            crossorigin="anonymous"></script>
    <script src="../../_ds_bundle.js"></script>
    <script src="../i18n.js"></script>
    <script src="../pos-tablet/data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-src="PhoneFrame.jsx">
    function PhoneFrame({ children, dark = true }) {
      return (
        <div style={{ width:390, height:844, borderRadius:44, background:'var(--surface-canvas)', border:'8px solid #2B2E30',
          position:'relative', overflow:'hidden', display:'flex', flexDirection:'column', flex:'0 0 auto' }}>
          <div style={{ height:46, display:'flex', alignItems:'center', padding:'0 26px', fontSize:14, fontWeight:600, color:'var(--text-primary)', fontFamily:'var(--font-ui)' }}>
            9:41
            <span style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', top:10, width:112, height:30, borderRadius:20, background:'#000' }} />
            <span style={{ marginLeft:'auto', display:'inline-flex', gap:5, alignItems:'center' }}>
              <span style={{ width:16, height:10, borderRadius:2, background:'currentColor', opacity:.9 }} />
              <span style={{ width:14, height:10, borderRadius:2, background:'currentColor', opacity:.9 }} />
              <span style={{ width:22, height:11, borderRadius:3, border:'1px solid currentColor', opacity:.9 }} />
            </span>
          </div>
          <div style={{ flex:1, minHeight:0, display:'flex', flexDirection:'column' }}>{children}</div>
          <div style={{ height:22, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <span style={{ width:134, height:5, borderRadius:3, background:'var(--text-primary)', opacity:.9 }} />
          </div>
        </div>
      );
    }
    Object.assign(window, { PhoneFrame });

</script>
<script type="text/babel" data-src="MobilePin.jsx">
    const { PinDots, NumericKeypad, Icon } = window.ComposDesignSystem_9739cd;

    function MobilePin({ onAuthed }) {
      const [pin, setPin] = React.useState('');
      const push = (k) => {
        if (k === 'del') return setPin((p) => p.slice(0, -1));
        const next = (pin + k).slice(0, 4);
        setPin(next);
        if (next.length === 4) setTimeout(onAuthed, 260);
      };
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:28, padding:'4px 16px 24px', height:'100%', alignItems:'center' }}>
          <span style={{ alignSelf:'flex-start', color:'var(--text-primary)' }}><Icon name="arrow-left" size={20} /></span>
          <span style={{ fontSize:'var(--text-body)', color:'var(--text-secondary)' }}>Enter your PIN</span>
          <PinDots filled={pin.length} />
          <NumericKeypad decimal={false} keySize={58} onKey={push} style={{ width:250, marginTop:'auto', marginBottom:24 }} />
        </div>
      );
    }
    Object.assign(window, { MobilePin });

</script>
<script type="text/babel" data-src="MobileMenu.jsx">
    const { CategoryTile, DishCard, SearchInput, Select, Button, Icon } = window.ComposDesignSystem_9739cd;

    function MobileMenu({ cart, setCart, onNext }) {
      const setQty = (name, price, v) => setCart((c) => {
        const next = { ...c };
        if (v <= 0) delete next[name]; else next[name] = { qty:v, price };
        return next;
      });
      const count = Object.values(cart).reduce((s, v) => s + v.qty, 0);
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:12, padding:'4px 16px 16px', height:'100%', minHeight:0 }}>
          <div style={{ display:'flex', alignItems:'center' }}>
            <Icon name="menu" size={22} />
            <Select value="Table 5" tone="raised" style={{ marginLeft:'auto', background:'transparent' }} />
          </div>
          <SearchInput width="100%" />
          <div style={{ display:'flex', gap:10, overflowX:'auto', paddingBottom:2 }}>
            {window.CATEGORIES.slice(0, 4).map((c) => <CategoryTile key={c.name} {...c} style={{ minWidth:104, height:84 }} />)}
          </div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, overflowY:'auto', flex:1, minHeight:0, alignContent:'start' }}>
            {window.DISHES.map((d) => (
              <DishCard key={d.name} {...d} qty={cart[d.name] ? cart[d.name].qty : 0}
                onQty={(v) => setQty(d.name, d.price, v)} style={{ minWidth:0 }} />
            ))}
          </div>
          <Button block size="lg" disabled={count === 0} onClick={onNext}>Add to Order</Button>
        </div>
      );
    }
    Object.assign(window, { MobileMenu });

</script>
<script type="text/babel" data-src="MobileOrder.jsx">
    const { Badge, Button, TotalsPanel, Icon } = window.ComposDesignSystem_9739cd;

    function MobileOrder({ cart, onBack, onPlace }) {
      const lines = Object.entries(cart);
      const subtotal = lines.reduce((s, [, v]) => s + v.qty * parseFloat(v.price.slice(1)), 0);
      return (
        <div style={{ display:'flex', flexDirection:'column', gap:12, padding:'4px 16px 16px', height:'100%', minHeight:0 }}>
          <div style={{ display:'flex', alignItems:'center', fontSize:'var(--text-body)', fontWeight:'var(--weight-medium)' }}>
            <button onClick={onBack} style={{ background:'none', border:'none', color:'inherit', cursor:'pointer', display:'inline-flex' }}><Icon name="arrow-left" size={20} /></button>
            <span style={{ margin:'0 auto' }}>Order #246</span>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:8, overflowY:'auto', flex:1, minHeight:0 }}>
            {lines.map(([name, v]) => (
              <div key={name} style={{ background:'var(--surface-card)', borderRadius:'var(--radius-sm)', padding:'14px 14px', display:'flex', alignItems:'center', gap:10, fontSize:'var(--text-sm)' }}>
                <Badge tone="inverse">{v.qty}</Badge>
                <span style={{ flex:1 }}>{name} <span style={{ color:'var(--text-muted)' }}>x{v.qty}</span></span>
                <span>{'$' + (v.qty * parseFloat(v.price.slice(1))).toFixed(2)}</span>
              </div>
            ))}
            <button onClick={onBack} style={{ border:'1px solid var(--border-hairline)', background:'transparent', color:'var(--text-primary)', borderRadius:'var(--radius-sm)', height:44, cursor:'pointer', fontFamily:'var(--font-ui)', fontSize:'var(--text-sm)' }}>+ Add</button>
          </div>
          <TotalsPanel lines={[{ label:'Subtotal', value:'$' + subtotal.toFixed(2) }, { label:'Tax 10%', value:'$' + (subtotal - subtotal / 1.16).toFixed(2) }]} total={'$' + subtotal.toFixed(2)} />
          <Button block size="lg" onClick={onPlace}>Place Order</Button>
        </div>
      );
    }
    Object.assign(window, { MobileOrder });

</script>
<script type="text/babel" data-src="MobileApp.jsx">
    function MobileApp() {
      const [step, setStep] = React.useState('pin');
      const [cart, setCart] = React.useState({ 'Pollo karaage': { qty:1, price:'$145' }, 'Pollo teriyaki': { qty:2, price:'$165' } });
      return (
        <div style={{ display:'flex', gap:40, alignItems:'center', justifyContent:'center', minHeight:'100vh', padding:40, background:'var(--light-canvas)' }}>
          <window.PhoneFrame>
            {step === 'pin' && <window.MobilePin onAuthed={() => setStep('menu')} />}
            {step === 'menu' && <window.MobileMenu cart={cart} setCart={setCart} onNext={() => setStep('order')} />}
            {step === 'order' && <window.MobileOrder cart={cart} onBack={() => setStep('menu')} onPlace={() => setStep('menu')} />}
          </window.PhoneFrame>
          <window.PhoneFrame>
            <window.MobileOrder cart={cart} onBack={() => {}} onPlace={() => {}} />
          </window.PhoneFrame>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp />);

</script>
<script>
    (function(){var n=decodeURIComponent(location.pathname.split('/').pop());try{parent!==window&&parent.postMessage({posScreen:n},'*')}catch(e){}window.addEventListener('message',function(e){if(e.data&&e.data.posTheme&&window.composSetTheme)window.composSetTheme(e.data.posTheme)});})();
</script>
</body>
</html>
